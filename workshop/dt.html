            const costTxA = paramOr('cost_tx_0', 1000);
            const costTxB = paramOr('cost_tx_1', 1500);
            const expectedTestCost = costTest + pTestPos * (costTxA + pDiseaseGivenPos * costBad + (1 - pDiseaseGivenPos) * costGood)
                                              + (1 - pTestPos) * (costTxB + pDiseaseGivenNeg * costBad + (1 - pDiseaseGivenNeg) * costGood);
            
            state.results[testName] = {
                ev: testEV,
                pGood: null,
                expectedCost: expectedTestCost,
                isTest: true
            };
            
            if (testEV > bestEV) {
                bestEV = testEV;
                bestOption = testName;
            }
        }
        
        state.results.bestEV = bestEV;
        state.results.bestOption = bestOption;
    }

    function updateSummaryTable() {
        const tbody = el('summaryBody');
        if (!tbody) return;
        
        calculateExpectedValues();
        
        // Include Test option if enabled
        const allOptions = state.hasTest ? [...state.options, state.testName || 'Test'] : state.options;
        
        const sorted = allOptions.map(opt => ({
            opt,
            ev: state.results[opt]?.ev || 0
        })).sort((a, b) => b.ev - a.ev);
        
        let html = '';
        sorted.forEach((item, i) => {
            const isPreferred = i === 0;
            html += `
                <tr class="${isPreferred ? 'preferred' : ''}">
                    <td>${isPreferred ? '✓ ' : ''}${esc(item.opt)}</td>
                    <td>${formatNumber(item.ev, 4)}</td>
                    <td>${i + 1}${isPreferred ? ' (Best)' : ''}</td>
                </tr>
            `;
        });
        
        tbody.innerHTML = html;
    }

    // ============================================
    // TORNADO DIAGRAM
    // ============================================
    
    function drawTornadoDiagram() {
        const svg = el('tornadoSvg');
        if (!svg) return;
        
        calculateExpectedValues();
        
        const width = 700;
        const margins = { top: 46, right: 120, bottom: 50, left: 200 };
        const plotWidth = width - margins.left - margins.right;

        // Row geometry. barGap is deliberately larger than the bar itself so the
        // threshold marker can put its tick marks and its "T=…" label in clear space
        // above and below each bar without touching the neighbouring rows.
        const barHeight = 22;
        const barGap = 26;

        const bestOption = state.results.bestOption;
        const baseEV = state.results.bestEV;
        const wtp = state.wtpThreshold || 50000;
        
        // Determine if using NMB (CEA mode + Intermediate/Advanced level)
        const useNMB = state.isCEA && (state.skillLevel === 'intermediate' || state.skillLevel === 'advanced');
        const metric = useNMB ? 'NMB' : 'EV';
        const metricLabel = useNMB ? 'Net Monetary Benefit (NMB)' : 'Expected Value (EV)';
        
        // Calculate base metric value
        const getMetricValue = (opt) => {
            const ev = state.results[opt]?.ev || 0;
            if (useNMB) {
                const cost = state.results[opt]?.expectedCost || 0;
                return ev * wtp - cost; // NMB = Effect * WTP - Cost
            }
            return ev;
        };
        
        const baseMetric = getMetricValue(bestOption);
        
        // Gather parameters with ranges
        const swings = [];
        
        // Ensure test parameters are included when test is enabled
        if (state.hasTest) {
            // Force initialize test_sens with range
            if (!state.parameters['test_sens']) {
                state.parameters['test_sens'] = {
                    estimate: 0.90,
                    hasRange: true,
                    min: '0.70',
                    max: '0.99',
                    distribution: 'fixed',
                    distParams: {},
                    isFormula: false,
                    formula: '',
                    citation: ''
                };
            } else {
                // Ensure existing param has range AND valid estimate
                state.parameters['test_sens'].hasRange = true;
                if (state.parameters['test_sens'].estimate === undefined || state.parameters['test_sens'].estimate === null) {
                    state.parameters['test_sens'].estimate = 0.90;
                }
                // Force set min/max (overwrite if needed)
                state.parameters['test_sens'].min = '0.70';
                state.parameters['test_sens'].max = '0.99';
            }
            
            // Force initialize test_spec with range
            if (!state.parameters['test_spec']) {
                state.parameters['test_spec'] = {
                    estimate: 0.85,
                    hasRange: true,
                    min: '0.65',
                    max: '0.95',
                    distribution: 'fixed',
                    distParams: {},
                    isFormula: false,
                    formula: '',
                    citation: ''
                };
            } else {
                // Ensure existing param has range AND valid estimate
                state.parameters['test_spec'].hasRange = true;
                if (state.parameters['test_spec'].estimate === undefined || state.parameters['test_spec'].estimate === null) {
                    state.parameters['test_spec'].estimate = 0.85;
                }
                // Force set min/max (overwrite if needed)
                state.parameters['test_spec'].min = '0.65';
                state.parameters['test_spec'].max = '0.95';
            }
            
        }
        
        Object.keys(state.parameters).forEach(paramId => {
            const param = state.parameters[paramId];
            
            // Extra logging for test params removed for production
            
            const hasRange = param.min !== '' && param.max !== '' && 
                           param.min !== undefined && param.max !== undefined;
            
            if (!hasRange) return;
            
            const min = parseFloat(param.min);
            const max = parseFloat(param.max);
            if (isNaN(min) || isNaN(max)) return;
            
            // Calculate metric at min and max
            const origValue = param.estimate;
            
            // Detect EVERY value at which the optimal option changes, not just the first.
            // A parameter can cross more than once: with a diagnostic test in play,
            // sweeping P(disease) usually crosses twice -- do-not-treat -> test -> treat --
            // and reporting only the first hid the test-treatment threshold completely.
            const thresholds = [];
            const steps = 20;

            const bestOptionAt = (val) => {
                param.estimate = val;
                state.evaluatedParams = {}; // Clear cache to force re-evaluation
                calculateExpectedValues();
                const allOpts = state.hasTest ? [...state.options, state.testName || 'Test'] : state.options;
                let winner = allOpts[0];
                let winnerVal = getMetricValue(allOpts[0]);
                allOpts.forEach(opt => {
                    const optVal = getMetricValue(opt);
                    if (optVal > winnerVal) {
                        winnerVal = optVal;
                        winner = opt;
                    }
                });
                return winner;
            };

            let scanPrevVal = min;
            let scanPrevBest = bestOptionAt(min);
            for (let i = 1; i <= steps; i++) {
                const val = min + (max - min) * (i / steps);
                const currentBest = bestOptionAt(val);
                if (currentBest !== scanPrevBest) {
                    // Bisect inside the bracketing cell so the reported crossover is the
                    // real one, not the midpoint of a coarse grid interval.
                    let lo = scanPrevVal;
                    let hi = val;
                    for (let k = 0; k < 12; k++) {
                        const mid = (lo + hi) / 2;
                        if (bestOptionAt(mid) === scanPrevBest) lo = mid; else hi = mid;
                    }
                    thresholds.push({ value: (lo + hi) / 2, from: scanPrevBest, to: currentBest });
                }
                scanPrevVal = val;
                scanPrevBest = currentBest;
            }
            
            param.estimate = min;
            state.evaluatedParams = {}; // Clear cache
            calculateExpectedValues();
            // Get EV for each option at min
            const allOptsForMetric = state.hasTest ? [...state.options, state.testName || 'Test'] : state.options;
            const evAtMin = {};
            allOptsForMetric.forEach(opt => {
                evAtMin[opt] = getMetricValue(opt);
            });
            
            param.estimate = max;
            state.evaluatedParams = {}; // Clear cache
            calculateExpectedValues();
            // Get EV for each option at max
            const evAtMax = {};
            allOptsForMetric.forEach(opt => {
                evAtMax[opt] = getMetricValue(opt);
            });
            
            // Calculate max swing across all options (not just best)
            let maxSwing = 0;
            let metricLow = -Infinity;
            let metricHigh = -Infinity;
            allOptsForMetric.forEach(opt => {
                const swing = Math.abs(evAtMax[opt] - evAtMin[opt]);
                if (swing > maxSwing) {
                    maxSwing = swing;
                    metricLow = Math.min(evAtMin[opt], evAtMax[opt]);
                    metricHigh = Math.max(evAtMin[opt], evAtMax[opt]);
                }
            });
            
            // Log test param swings
            if (paramId === 'test_sens' || paramId === 'test_spec') {
                console.log(`${paramId} swing calculation:`, {
                    min: min,
                    max: max,
                    origValue: origValue,
                    evAtMin: evAtMin,
                    evAtMax: evAtMax,
                    maxSwing: maxSwing,
                    metricLow: metricLow,
                    metricHigh: metricHigh
                });
            }
            
            param.estimate = origValue;
            state.evaluatedParams = {}; // Clear cache after tornado calculations
            
            swings.push({
                param: paramId,
                label: getParamLabel(paramId),
                base: origValue,
                low: min,
                high: max,
                evLow: metricLow,
                evHigh: metricHigh,
                swing: maxSwing,
                thresholds // every crossover found, in ascending parameter order
            });
        });
        
        // EXPLICIT test parameter handling - ensure they're processed even if not in state.parameters
        if (state.hasTest) {
            const testParamsToProcess = [
                { id: 'test_sens', label: 'Test Sensitivity', estimate: 0.90, min: 0.70, max: 0.99 },
                { id: 'test_spec', label: 'Test Specificity', estimate: 0.85, min: 0.65, max: 0.95 }
            ];
            
            testParamsToProcess.forEach(tp => {
                // Check if already processed
                if (swings.some(s => s.param === tp.id)) {
                    console.log(`${tp.id} already in swings, skipping explicit processing`);
                    return;
                }
                
                console.log(`Explicitly processing ${tp.id} for tornado`);
                
                const origValue = paramOr(tp.id, tp.estimate);
                const min = tp.min;
                const max = tp.max;
                
                // Ensure the parameter exists in state for modification
                if (!state.parameters[tp.id]) {
                    state.parameters[tp.id] = {
                        estimate: origValue,
                        hasRange: true,
                        min: String(min),
                        max: String(max),
                        distribution: 'fixed',
                        distParams: {},
                        isFormula: false,
                        formula: '',
                        citation: ''
                    };
                }
                
                const param = state.parameters[tp.id];
                const allOptsForMetric = [...state.options, state.testName || 'Test'];
                
                // Calculate at min
                param.estimate = min;
                state.evaluatedParams = {};
                calculateExpectedValues();
                const evAtMin = {};
                allOptsForMetric.forEach(opt => {
                    evAtMin[opt] = getMetricValue(opt);
                });
                
                // Calculate at max
                param.estimate = max;
                state.evaluatedParams = {};
                calculateExpectedValues();
                const evAtMax = {};
                allOptsForMetric.forEach(opt => {
                    evAtMax[opt] = getMetricValue(opt);
                });
                
                // Calculate max swing
                let maxSwing = 0;
                let metricLow = -Infinity;
                let metricHigh = -Infinity;
                allOptsForMetric.forEach(opt => {
                    const swing = Math.abs(evAtMax[opt] - evAtMin[opt]);
                    if (swing > maxSwing) {
                        maxSwing = swing;
                        metricLow = Math.min(evAtMin[opt], evAtMax[opt]);
                        metricHigh = Math.max(evAtMin[opt], evAtMax[opt]);
                    }
                });
                
                
                // Restore original value
                param.estimate = origValue;
                state.evaluatedParams = {};
                
                // ALWAYS add test parameters to swings (they're important to show even if swing is small)
                swings.push({
                    param: tp.id,
                    label: tp.label,
                    base: origValue,
                    low: min,
                    high: max,
                    evLow: metricLow !== -Infinity ? metricLow : baseMetric - 0.01,
                    evHigh: metricHigh !== -Infinity ? metricHigh : baseMetric + 0.01,
                    swing: Math.max(maxSwing, 0.001), // Ensure minimum visible swing
                    thresholds: []
                });
            });
        }
        
        // Recalculate with original values
        calculateExpectedValues();
        
        
        // Filter out parameters with zero or near-zero swing, then sort by swing
        // BUT always keep test_sens and test_spec when test is enabled (even if swing is small)
        const filteredSwings = swings.filter(s => {
            // Always keep test parameters when test is enabled
            if (state.hasTest && (s.param === 'test_sens' || s.param === 'test_spec')) {
                return true;
            }
            return s.swing > 0.0001;
        });
        
        filteredSwings.sort((a, b) => b.swing - a.swing);
        const topSwings = filteredSwings.slice(0, 10);

        // Height grows with the number of bars so every row keeps its full barGap.
        const height = margins.top + margins.bottom + Math.max(1, topSwings.length) * (barHeight + barGap);
        const plotHeight = height - margins.top - margins.bottom;
        svg.style.height = `${height}px`;

        if (topSwings.length === 0) {
            svg.innerHTML = `<svg viewBox="0 0 ${width} ${height}">
                <text x="${width/2}" y="${height/2}" text-anchor="middle" fill="#7f8c8d">
                    No parameter ranges defined. Add min/max values to see tornado diagram.
                </text>
            </svg>`;
            return;
        }

        // Find metric range
        const allMetrics = topSwings.flatMap(s => [s.evLow, s.evHigh]);
        let metricMin, metricMax;
        
        if (state.tornadoZoomOut) {
            // Zoom Out: use full theoretical range
            if (useNMB) {
                // For NMB, use reasonable cost-based range (factors of 10)
                const absMax = Math.max(Math.abs(Math.min(...allMetrics)), Math.abs(Math.max(...allMetrics)), Math.abs(baseMetric));
                const magnitude = Math.pow(10, Math.ceil(Math.log10(absMax + 1)));
                metricMin = -magnitude;
                metricMax = magnitude;
            } else {
                // For utilities/probabilities, use 0-1 range
                metricMin = 0;
                metricMax = 1;
            }
        } else {
            // Normal zoom: fit to data
            metricMin = Math.min(...allMetrics, baseMetric) - (useNMB ? 1000 : 0.02);
            metricMax = Math.max(...allMetrics, baseMetric) + (useNMB ? 1000 : 0.02);
        }
        
        const xScale = (val) => margins.left + ((val - metricMin) / (metricMax - metricMin)) * plotWidth;

        let svgContent = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        
        // Title
        const titleSuffix = useNMB ? `(Net Monetary Benefit at WTP=$${wtp.toLocaleString()})` : '';
        svgContent += `<text x="${width / 2}" y="20" text-anchor="middle" font-size="14" font-weight="bold">
                            Tornado Diagram - ${esc(bestOption)} ${titleSuffix}</text>`;
        
        // Y-axis label (rotated)
        svgContent += `<text x="15" y="${height / 2}" text-anchor="middle" font-size="11" 
                            transform="rotate(-90, 15, ${height / 2})">Parameters</text>`;
        
        // Base metric line
        const baseX = xScale(baseMetric);
        svgContent += `<line x1="${baseX}" y1="${margins.top}" x2="${baseX}" y2="${height - margins.bottom}" 
                            stroke="${CONFIG.colors.dark}" stroke-width="2"/>`;
        const baseLabel = useNMB ? `Base NMB: $${Math.round(baseMetric).toLocaleString()}` : `Base: ${formatNumber(baseMetric)}`;
        svgContent += `<text x="${baseX}" y="${height - margins.bottom + 15}" text-anchor="middle" 
                            font-size="10">${baseLabel}</text>`;
        
        // Bars
        topSwings.forEach((swing, i) => {
            const y = margins.top + i * (barHeight + barGap);
            let xLow = xScale(swing.evLow);
            let xHigh = xScale(swing.evHigh);
            
            // For test parameters with tiny swing, ensure minimum visible bar width
            const isTestParam = swing.param === 'test_sens' || swing.param === 'test_spec';
            const minBarWidth = 15; // minimum visible width in pixels
            if (isTestParam && Math.abs(xHigh - xLow) < minBarWidth * 2) {
                // Center a minimum width bar around the base value
                const midPoint = (xLow + xHigh) / 2;
                xLow = midPoint - minBarWidth;
                xHigh = midPoint + minBarWidth;
            }
            
            // Determine bar positions
            const leftX = Math.min(xLow, xHigh, baseX);
            const rightX = Math.max(xLow, xHigh, baseX);
            
            // Invisible clickable area for the entire bar row
            svgContent += `<rect x="${margins.left}" y="${y}" 
                                width="${plotWidth}" height="${barHeight}" 
                                fill="transparent" style="cursor: pointer;"
                                onclick="DT.showSensitivity('${swing.param}')"/>`;
            
            // Low portion (red)
            if (xLow < baseX) {
                svgContent += `<rect class="tornado-bar" x="${xLow}" y="${y}" 
                                    width="${baseX - xLow}" height="${barHeight}" 
                                    fill="${CONFIG.colors.danger}" opacity="0.8" style="cursor: pointer;"
                                    onclick="DT.showSensitivity('${swing.param}')"><title>Click for sensitivity analysis</title></rect>`;
            } else if (xLow > baseX) {
                svgContent += `<rect class="tornado-bar" x="${baseX}" y="${y}" 
                                    width="${xLow - baseX}" height="${barHeight}" 
                                    fill="${CONFIG.colors.danger}" opacity="0.8" style="cursor: pointer;"
                                    onclick="DT.showSensitivity('${swing.param}')"><title>Click for sensitivity analysis</title></rect>`;
            }
            
            // High portion (blue)
            if (xHigh > baseX) {
                svgContent += `<rect class="tornado-bar" x="${baseX}" y="${y}" 
                                    width="${xHigh - baseX}" height="${barHeight}" 
                                    fill="${CONFIG.colors.primary}" opacity="0.8" style="cursor: pointer;"
                                    onclick="DT.showSensitivity('${swing.param}')"><title>Click for sensitivity analysis</title></rect>`;
            } else if (xHigh < baseX) {
                svgContent += `<rect class="tornado-bar" x="${xHigh}" y="${y}" 
                                    width="${baseX - xHigh}" height="${barHeight}" 
                                    fill="${CONFIG.colors.primary}" opacity="0.8" style="cursor: pointer;"
                                    onclick="DT.showSensitivity('${swing.param}')"><title>Click for sensitivity analysis</title></rect>`;
            }
            
            // Threshold markers - a parameter may cross more than once, so draw them all.
            const swingThresholds = swing.thresholds || [];
            if (swingThresholds.length && swing.swing > 0.0001) {
                const thresholdY = y + barHeight / 2;
                // Labels default to the gap above the bar; if two markers sit close enough
                // that their plates would overlap, the next one drops to the gap below.
                const placedAbove = [];
                const placedBelow = [];

                swingThresholds.forEach((th, tIdx) => {
                    // Interpolate x position based on parameter value
                    const thresholdFrac = (th.value - swing.low) / (swing.high - swing.low);
                    // The threshold in EV space
                    const thresholdEV = swing.evLow + (swing.evHigh - swing.evLow) * thresholdFrac;
                    const thresholdX = xScale(thresholdEV);

                    const thresholdText = swingThresholds.length > 1
                        ? `T${tIdx + 1}=${formatNumber(th.value, 2)}`
                        : `T=${formatNumber(th.value, 2)}`;
                    const plateWidth = thresholdText.length * 5 + 8;
                    const span = [thresholdX - plateWidth / 2, thresholdX + plateWidth / 2];
                    const clashes = (taken) => taken.some(r => span[0] < r[1] && span[1] > r[0]);
                    const below = clashes(placedAbove) && !clashes(placedBelow);
                    (below ? placedBelow : placedAbove).push(span);

                    // Tick marks sit in the gap above and below the bar, clear of it.
                    svgContent += `<line x1="${thresholdX}" y1="${y - 6}" x2="${thresholdX}" y2="${y - 1}" stroke="${CONFIG.colors.warning}" stroke-width="1"/>`;
                    svgContent += `<line x1="${thresholdX}" y1="${y + barHeight + 1}" x2="${thresholdX}" y2="${y + barHeight + 6}" stroke="${CONFIG.colors.warning}" stroke-width="1"/>`;
                    // Orange diamond marker, centred on the bar
                    svgContent += `<polygon points="${thresholdX},${thresholdY - 7} ${thresholdX + 6},${thresholdY} ${thresholdX},${thresholdY + 7} ${thresholdX - 6},${thresholdY}"
                                        fill="${CONFIG.colors.warning}" stroke="#d68910" stroke-width="1"
                                        ><title>${esc(thresholdText.replace('=', ' = '))} — ${esc(th.from)} → ${esc(th.to)}</title></polygon>`;
                    // Label on a white plate so it never collides with the bar, the
                    // diamond, or the neighbouring rows.
                    const plateY = below ? y + barHeight + 7 : y - 18;
                    const textY = below ? y + barHeight + 15.5 : y - 9.5;
                    svgContent += `<rect x="${span[0]}" y="${plateY}" width="${plateWidth}" height="11"
                                        fill="white" opacity="0.9" rx="2"/>`;
                    svgContent += `<text x="${thresholdX}" y="${textY}" text-anchor="middle"
                                        font-size="9" fill="${CONFIG.colors.warning}" font-weight="bold">${thresholdText}</text>`;
                });
            }

            // Label
            svgContent += `<text x="${margins.left - 10}" y="${y + barHeight / 2 + 4}"
                                text-anchor="end" font-size="10">${esc(swing.label)}${swingThresholds.length ? ' ⚠' : ''}</text>`;
        });

        // Legend for threshold marker
        const thresholdCount = topSwings.reduce((n, s) => n + (s.thresholds ? s.thresholds.length : 0), 0);
        const hasThresholds = thresholdCount > 0;
        if (hasThresholds) {
            svgContent += `<polygon points="${width - margins.right + 15},${margins.top + 5} ${width - margins.right + 21},${margins.top + 11} ${width - margins.right + 15},${margins.top + 17} ${width - margins.right + 9},${margins.top + 11}" 
                                fill="${CONFIG.colors.warning}" stroke="#d68910" stroke-width="1"/>`;
            svgContent += `<text x="${width - margins.right + 28}" y="${margins.top + 14}" font-size="9" fill="${CONFIG.colors.dark}">${thresholdCount > 1 ? `Thresholds (${thresholdCount})` : 'Threshold'}</text>`;
        }
        
        // X-axis
        svgContent += `<line x1="${margins.left}" y1="${height - margins.bottom}" 
                            x2="${width - margins.right}" y2="${height - margins.bottom}" 
                            stroke="${CONFIG.colors.dark}"/>`;
        
        // Get outcome label for x-axis
        let xAxisLabel = metricLabel; // Uses NMB or EV label already computed
        if (!useNMB) {
            // Get the selected outcome type label
            const outcomeType = CONFIG.outcomeTypes.find(o => o.id === state.selectedOutcomes[0]);
            if (outcomeType) {
                xAxisLabel = `Expected ${outcomeType.label}`;
            }
        }
        
        svgContent += `<text x="${width / 2}" y="${height - 5}" text-anchor="middle" 
                            font-size="11">${xAxisLabel}</text>`;
        
        svgContent += '</svg>';
        svg.innerHTML = svgContent;
    }

    function getParamLabel(paramId) {
        // Check if it's a custom parameter first
        const cp = state.customParams?.[paramId];
        if (cp?.label) {
            return cp.label;
        }
        
        // Limb labels: [disease present, disease absent]
        const [presentLabel, absentLabel] = getDiseaseStateLabels(0);

        const labels = {
            'p_disease': `P(${presentLabel})`,
            'v_good': `U(${absentLabel})`,
            'v_bad': `U(${presentLabel})`,
            'v_pos_good': `U(D+, ${absentLabel})`,
            'v_pos_bad': `U(D+, ${presentLabel})`,
            'v_neg_good': `U(D-, ${absentLabel})`,
            'v_neg_bad': `U(D-, ${presentLabel})`,
            'test_sens': 'Test Sensitivity',
            'test_spec': 'Test Specificity'
        };
        
        if (labels[paramId]) return labels[paramId];
        
        // Simplified option-specific params (p_good_N)
        const simpleMatch = paramId.match(/p_good_(\d+)/);
        if (simpleMatch) {
            const idx = parseInt(simpleMatch[1]);
            const opt = state.options[idx] || `Option ${idx + 1}`;
            return `P(${absentLabel} | ${opt})`;
        }
        
        // Alternative-specific valuations (v_good_N, v_bad_N)
        const vGoodMatch = paramId.match(/v_good_(\d+)/);
        if (vGoodMatch) {
            const idx = parseInt(vGoodMatch[1]);
            const opt = state.options[idx] || `Option ${idx + 1}`;
            return `U(${absentLabel} | ${opt})`;
        }
        const pathMatch = paramId.match(/^v_path_(\d+)_([01]+)$/);
        if (pathMatch) {
            return pathUtilityLabel(parseInt(pathMatch[1]), pathMatch[2].split('').map(Number));
        }

        const vBadMatch = paramId.match(/v_bad_(\d+)/);
        if (vBadMatch) {
            const idx = parseInt(vBadMatch[1]);
            const opt = state.options[idx] || `Option ${idx + 1}`;
            return `U(${presentLabel} | ${opt})`;
        }
        
        // Cost parameters (cost_N)
        const costMatch = paramId.match(/cost_(\d+)/);
        if (costMatch) {
            const idx = parseInt(costMatch[1]);
            const opt = state.options[idx] || `Option ${idx + 1}`;
            return `Cost of ${opt}`;
        }
        
        // Legacy option-specific params (p_good_pos_N, p_good_neg_N)
        const legacyMatch = paramId.match(/p_good_(pos|neg)_(\d+)/);
        if (legacyMatch) {
            const dir = legacyMatch[1] === 'pos' ? 'D+' : 'D-';
            const idx = parseInt(legacyMatch[2]);
            const opt = state.options[idx] || `Opt ${idx + 1}`;
            return `P(${absentLabel}|${dir}, ${opt})`;
        }
        
        return paramId;
    }

    // ============================================
    // SENSITIVITY ANALYSIS
    // ============================================
    
    let currentSensitivity = null;
    let zoomState = { thresholds: [] };
    let sensitivityZoomOut = false;

    function showSensitivity(paramId) {
        currentSensitivity = paramId;
        const param = state.parameters[paramId];
        if (!param) return;
        
        const min = parseFloat(param.min) || 0;
        const max = parseFloat(param.max) || 1;
        
        el('sensitivityTitle').textContent = getParamLabel(paramId);
        el('sensitivityModal').classList.add('active');
        
        // Reset zoom state and update button text
        sensitivityZoomOut = false;
        const btn = document.getElementById('sensitivityZoomBtn');
        if (btn) btn.textContent = '🔍 Zoom Out';
        
        drawSensitivityChart(paramId, min, max);
    }
    
    function toggleSensitivityZoom() {
        sensitivityZoomOut = !sensitivityZoomOut;
        const btn = document.getElementById('sensitivityZoomBtn');
        if (btn) {
            btn.textContent = sensitivityZoomOut ? '🔍 Zoom In' : '🔍 Zoom Out';
        }
        // Redraw with current parameter
        if (currentSensitivity) {
            const param = state.parameters[currentSensitivity];
            if (param) {
                const min = parseFloat(param.min) || 0;
                const max = parseFloat(param.max) || 1;
                drawSensitivityChart(currentSensitivity, min, max);
            }
        }
    }

    function drawSensitivityChart(paramId, xMin, xMax) {
        const svg = el('sensitivitySvg');
        if (!svg) return;
        
        const param = state.parameters[paramId];
        const width = 800;
        const height = 350;
        const margins = { top: 40, right: 100, bottom: 60, left: 70 };
        const plotWidth = width - margins.left - margins.right;
        const plotHeight = height - margins.top - margins.bottom;
        
        // Determine if this is a probability/utility parameter (0-1 range)
        const isProbOrUtil = paramId.startsWith('p_') || paramId.startsWith('v_') || 
                            paramId === 'test_sens' || paramId === 'test_spec';
        
        // Apply zoom out if enabled
        let effectiveXMin = xMin;
        let effectiveXMax = xMax;
        if (sensitivityZoomOut) {
            if (isProbOrUtil) {
                effectiveXMin = 0;
                effectiveXMax = 1;
            } else if (paramId.startsWith('cost')) {
                // For costs, expand to factors of 10
                const magnitude = Math.pow(10, Math.ceil(Math.log10(Math.max(Math.abs(xMin), Math.abs(xMax)) + 1)));
                effectiveXMin = 0;
                effectiveXMax = magnitude;
            }
        }
        
        const steps = 50;
        const stepSize = (effectiveXMax - effectiveXMin) / steps;
        const origValue = param.estimate;
        
        // Calculate EV for each option at each parameter value
        const dataByOption = {};
        
        // Include Test option if enabled
        const allOptions = state.hasTest ? [...state.options, state.testName || 'Test'] : [...state.options];
        
        allOptions.forEach(opt => {
            dataByOption[opt] = [];
            
            for (let i = 0; i <= steps; i++) {
                const paramValue = effectiveXMin + i * stepSize;
                param.estimate = paramValue;
                state.evaluatedParams = {};
                calculateExpectedValues();
                dataByOption[opt].push({ x: paramValue, y: state.results[opt]?.ev || 0 });
            }
        });
        
        // Restore original
        param.estimate = origValue;
        state.evaluatedParams = {};
        calculateExpectedValues();
        
        // Find y-axis range
        const allYs = Object.values(dataByOption).flatMap(d => d.map(p => p.y));
        let yMin, yMax;
        if (sensitivityZoomOut) {
            // Use 0-1 range for zoomed out y-axis
            yMin = 0;
            yMax = 1;
        } else {
            yMin = Math.min(...allYs) - 0.01;
            yMax = Math.max(...allYs) + 0.01;
        }
        
        const xScale = (val) => margins.left + ((val - effectiveXMin) / (effectiveXMax - effectiveXMin)) * plotWidth;
        const yScale = (val) => margins.top + plotHeight - ((val - yMin) / (yMax - yMin)) * plotHeight;
        
        // Get outcome label for y-axis
        const outcomeType = CONFIG.outcomeTypes.find(o => o.id === state.selectedOutcomes[0]);
        const yAxisLabel = outcomeType ? `Expected ${outcomeType.label}` : 'Expected Value';
        
        let svgContent = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        
        // Title
        svgContent += `<text x="${width / 2}" y="20" text-anchor="middle" font-size="12" font-weight="bold">
                            One-Way Sensitivity Analysis: ${esc(getParamLabel(paramId))}</text>`;
        
        // Axes
        svgContent += `<line x1="${margins.left}" y1="${margins.top}" x2="${margins.left}" y2="${height - margins.bottom}" 
                            stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
        svgContent += `<line x1="${margins.left}" y1="${height - margins.bottom}" 
                            x2="${width - margins.right}" y2="${height - margins.bottom}" 
                            stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
        
        // Y-axis label (rotated)
        svgContent += `<text x="15" y="${height / 2}" text-anchor="middle" font-size="11" 
                            transform="rotate(-90, 15, ${height / 2})">${yAxisLabel}</text>`;
        
        // X-axis label
        svgContent += `<text x="${width / 2}" y="${height - 5}" text-anchor="middle" font-size="11">${esc(getParamLabel(paramId))}</text>`;
        
        // Y-axis tick marks and labels
        for (let i = 0; i <= 5; i++) {
            const val = yMin + (yMax - yMin) * (i / 5);
            const y = yScale(val);
            svgContent += `<line x1="${margins.left - 5}" y1="${y}" x2="${margins.left}" y2="${y}" stroke="${CONFIG.colors.dark}"/>`;
            svgContent += `<text x="${margins.left - 10}" y="${y + 4}" text-anchor="end" font-size="9">${formatNumber(val, 2)}</text>`;
        }
        
        // Base value line
        if (origValue >= effectiveXMin && origValue <= effectiveXMax) {
            const baseX = xScale(origValue);
            svgContent += `<line x1="${baseX}" y1="${margins.top}" x2="${baseX}" y2="${height - margins.bottom}" 
                                stroke="${CONFIG.colors.success}" stroke-width="2" stroke-dasharray="5,3"/>`;
            svgContent += `<text x="${baseX}" y="${margins.top - 5}" text-anchor="middle" font-size="9" 
                                fill="${CONFIG.colors.success}">Base: ${formatNumber(origValue)}</text>`;
        }
        
        // Plot lines for each option
        const thresholds = [];
        
        allOptions.forEach((opt, optIdx) => {
            const data = dataByOption[opt];
            const isTestOpt = state.hasTest && opt === (state.testName || 'Test');
            const color = isTestOpt ? CONFIG.colors.purple : CONFIG.colors.optionColors[optIdx % CONFIG.colors.optionColors.length];
            
            let pathD = `M ${xScale(data[0].x)} ${yScale(data[0].y)}`;
            data.slice(1).forEach(p => {
                pathD += ` L ${xScale(p.x)} ${yScale(p.y)}`;
            });
            svgContent += `<path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" ${isTestOpt ? 'stroke-dasharray="6,3"' : ''}/>`;
            
            // Legend
            const legendY = margins.top + optIdx * 20;
            svgContent += `<line x1="${width - margins.right + 10}" y1="${legendY}" 
                                x2="${width - margins.right + 30}" y2="${legendY}" 
                                stroke="${color}" stroke-width="2.5" ${isTestOpt ? 'stroke-dasharray="6,3"' : ''}/>`;
            svgContent += `<text x="${width - margins.right + 35}" y="${legendY + 4}" font-size="10">${esc(opt)}</text>`;
        });
        
        // Find thresholds (between all pairs including Test)
        for (let i = 0; i < allOptions.length; i++) {
            for (let j = i + 1; j < allOptions.length; j++) {
                const data1 = dataByOption[allOptions[i]];
                const data2 = dataByOption[allOptions[j]];
                
                for (let k = 1; k < data1.length; k++) {
                    const diff1 = data1[k-1].y - data2[k-1].y;
                    const diff2 = data1[k].y - data2[k].y;
                    
                    if (diff1 * diff2 < 0) {
                        const t = Math.abs(diff1) / (Math.abs(diff1) + Math.abs(diff2));
                        const threshold = data1[k-1].x + t * (data1[k].x - data1[k-1].x);
                        
                        if (!thresholds.some(th => Math.abs(th.value - threshold) < 0.001)) {
                            thresholds.push({
                                value: threshold,
                                options: [allOptions[i], allOptions[j]],
                                optionIndices: [i, j]
                            });
                        }
                    }
                }
            }
        }
        
        thresholds.sort((a, b) => a.value - b.value);
        zoomState.thresholds = thresholds;
        
        // Draw threshold lines (each with distinct color)
        thresholds.forEach((th, idx) => {
            if (th.value >= effectiveXMin && th.value <= effectiveXMax) {
                const thX = xScale(th.value);
                const thColor = CONFIG.colors.thresholdColors[idx % CONFIG.colors.thresholdColors.length];
                svgContent += `<line x1="${thX}" y1="${margins.top}" x2="${thX}" y2="${height - margins.bottom}" 
                                    stroke="${thColor}" stroke-width="2" stroke-dasharray="4,4"/>`;
                svgContent += `<text x="${thX}" y="${height - margins.bottom + 35}" text-anchor="middle" 
                                    font-size="9" fill="${thColor}" font-weight="bold">
                                    T${idx + 1}: ${formatNumber(th.value)}</text>`;
            }
        });
        
        // X-axis labels
        for (let i = 0; i <= 5; i++) {
            const val = effectiveXMin + (effectiveXMax - effectiveXMin) * (i / 5);
            const x = xScale(val);
            svgContent += `<text x="${x}" y="${height - margins.bottom + 15}" text-anchor="middle" font-size="9">
                                ${formatNumber(val)}</text>`;
        }
        
        svgContent += '</svg>';
        svg.innerHTML = svgContent;
        
        // Build zoom controls with threshold-colored buttons
        buildZoomControls(thresholds, origValue);
        
        // Update info
        el('sensitivityInfo').innerHTML = `
            <p><strong>Parameter:</strong> ${esc(getParamLabel(paramId))}</p>
            <p><strong>Base Value:</strong> ${formatNumber(origValue, 4)}</p>
            <p><strong>Range:</strong> ${formatNumber(xMin, 4)} to ${formatNumber(xMax, 4)}</p>
            <p><strong>Thresholds:</strong> ${thresholds.length === 0 ? 'None' : 
                thresholds.map((t, i) => `T${i+1}=${formatNumber(t.value, 4)} (${esc(t.options.join(' vs '))})`).join(', ')}</p>
        `;
    }

    function buildZoomControls(thresholds, baseValue) {
        const container = el('zoomControls');
        if (!container) return;
        
        let html = `<button class="btn btn-success" onclick="DT.zoomToBase()">🔍 Zoom to Base</button>`;
        
        thresholds.forEach((th, idx) => {
            // Use threshold colors (matching the threshold lines)
            const color = CONFIG.colors.thresholdColors[idx % CONFIG.colors.thresholdColors.length];
            html += `<button class="btn" style="background: ${color}; color: white;" 
                            onclick="DT.zoomToThreshold(${idx})">
                        🔍 Threshold ${idx + 1} (${esc(th.options.join('/'))})
                    </button>`;
        });
        
        html += `<button class="btn btn-secondary" onclick="DT.resetZoom()">↩️ Reset View</button>`;
        
        container.innerHTML = html;
    }

    function zoomToBase() {
        if (!currentSensitivity) return;
        const param = state.parameters[currentSensitivity];
        const base = param.estimate;
        const min = parseFloat(param.min) || 0;
        const max = parseFloat(param.max) || 1;
        const span = (max - min) * 0.2;
        drawSensitivityChart(currentSensitivity, Math.max(min, base - span), Math.min(max, base + span));
    }

    function zoomToThreshold(idx) {
        if (!currentSensitivity || idx >= zoomState.thresholds.length) return;
        const param = state.parameters[currentSensitivity];
        const min = parseFloat(param.min) || 0;
        const max = parseFloat(param.max) || 1;
        const threshold = zoomState.thresholds[idx].value;
        const span = (max - min) * 0.15;
        drawSensitivityChart(currentSensitivity, Math.max(min, threshold - span), Math.min(max, threshold + span));
    }

    function resetZoom() {
        if (!currentSensitivity) return;
        const param = state.parameters[currentSensitivity];
        const min = parseFloat(param.min) || 0;
        const max = parseFloat(param.max) || 1;
        drawSensitivityChart(currentSensitivity, min, max);
    }

        el('sensitivityModal').classList.remove('active');
    }

    // ============================================
    // COST-EFFECTIVENESS ANALYSIS
    // ============================================
    
    function updateCEA() {
        if (!state.isCEA) return;
        
        drawICERPlane();
        updateICERTable();
    }

    function drawICERPlane() {
        const svg = el('icerPlaneSvg');
        if (!svg) return;
        
        const width = 400;
        const height = 350;
        const margins = { top: 30, right: 30, bottom: 50, left: 60 };
        const plotWidth = width - margins.left - margins.right;
        const plotHeight = height - margins.top - margins.bottom;
        
        // Get WTP threshold
        const wtp = state.wtpThreshold || 50000;
        
        // Calculate costs and effects for each option
        calculateExpectedValues();
        
        const ceData = state.options.map((opt, i) => {
            const ev = state.results[opt]?.ev || 0;
            const cost = state.results[opt]?.expectedCost || (10000 + i * 5000);
            return { option: opt, effect: ev, cost: cost, index: i };
        });
        
        // Find reference (lowest cost option for incremental analysis)
        ceData.sort((a, b) => a.cost - b.cost);
        const reference = ceData[0];
        
        // Calculate incremental values
        const incrementalData = ceData.map(d => ({
            ...d,
            incCost: d.cost - reference.cost,
            incEffect: d.effect - reference.effect
        }));
        
        // Find axis ranges
        const allIncCosts = incrementalData.map(d => d.incCost);
        const allIncEffects = incrementalData.map(d => d.incEffect);
        
        const maxAbsCost = Math.max(Math.abs(Math.min(...allIncCosts)), Math.abs(Math.max(...allIncCosts)), 1000);
        const maxAbsEffect = Math.max(Math.abs(Math.min(...allIncEffects)), Math.abs(Math.max(...allIncEffects)), 0.1);
        
        const xMin = -maxAbsEffect * 1.2;
        const xMax = maxAbsEffect * 1.2;
        const yMin = -maxAbsCost * 1.2;
        const yMax = maxAbsCost * 1.2;
        
        const xScale = (val) => margins.left + ((val - xMin) / (xMax - xMin)) * plotWidth;
        const yScale = (val) => margins.top + plotHeight - ((val - yMin) / (yMax - yMin)) * plotHeight;
        
        let svgContent = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        
        // Background quadrants
        const centerX = xScale(0);
        const centerY = yScale(0);
        
        // NW quadrant (dominated - more cost, less effect) - red
        svgContent += `<rect x="${margins.left}" y="${margins.top}" 
                            width="${centerX - margins.left}" height="${centerY - margins.top}" 
                            fill="rgba(231, 76, 60, 0.1)"/>`;
        
        // SE quadrant (dominant - less cost, more effect) - green
        svgContent += `<rect x="${centerX}" y="${centerY}" 
                            width="${width - margins.right - centerX}" height="${height - margins.bottom - centerY}" 
                            fill="rgba(39, 174, 96, 0.1)"/>`;
        
        // NE and SW quadrants - yellow (tradeoff)
        svgContent += `<rect x="${centerX}" y="${margins.top}" 
                            width="${width - margins.right - centerX}" height="${centerY - margins.top}" 
                            fill="rgba(241, 196, 15, 0.1)"/>`;
        svgContent += `<rect x="${margins.left}" y="${centerY}" 
                            width="${centerX - margins.left}" height="${height - margins.bottom - centerY}" 
                            fill="rgba(241, 196, 15, 0.1)"/>`;
        
        // WTP threshold line (from origin)
        if (wtp > 0) {
            const wtpX1 = xScale(0);
            const wtpY1 = yScale(0);
            const wtpX2 = xScale(maxAbsEffect);
            const wtpY2 = yScale(wtp * maxAbsEffect);
            svgContent += `<line x1="${wtpX1}" y1="${wtpY1}" x2="${wtpX2}" y2="${Math.max(margins.top, wtpY2)}" 
                                stroke="${CONFIG.colors.purple}" stroke-width="2" stroke-dasharray="5,5"/>`;
            svgContent += `<text x="${wtpX2 - 5}" y="${Math.max(margins.top + 15, wtpY2 + 15)}" 
                                font-size="10" fill="${CONFIG.colors.purple}" text-anchor="end">WTP=$${wtp.toLocaleString()}</text>`;
        }
        
        // Axes
        svgContent += `<line x1="${margins.left}" y1="${centerY}" x2="${width - margins.right}" y2="${centerY}" 
                            stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
        svgContent += `<line x1="${centerX}" y1="${margins.top}" x2="${centerX}" y2="${height - margins.bottom}" 
                            stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
        
        // Axis labels
        svgContent += `<text x="${width / 2}" y="${height - 10}" text-anchor="middle" font-size="11">Incremental Effect (ΔE)</text>`;
        svgContent += `<text x="15" y="${height / 2}" text-anchor="middle" font-size="11" 
                            transform="rotate(-90, 15, ${height / 2})">Incremental Cost (ΔC)</text>`;
        
        // Plot points
        incrementalData.forEach((d, i) => {
            const x = xScale(d.incEffect);
            const y = yScale(d.incCost);
            const color = CONFIG.colors.optionColors[d.index % CONFIG.colors.optionColors.length];
            
            svgContent += `<circle cx="${x}" cy="${y}" r="8" fill="${color}" stroke="white" stroke-width="2"/>`;
            svgContent += `<text x="${x + 12}" y="${y + 4}" font-size="10" fill="${CONFIG.colors.dark}">${d.option}</text>`;
        });
        
        // Quadrant labels
        svgContent += `<text x="${margins.left + 5}" y="${margins.top + 15}" font-size="9" fill="${CONFIG.colors.danger}">Dominated</text>`;
        svgContent += `<text x="${width - margins.right - 50}" y="${height - margins.bottom - 5}" font-size="9" fill="${CONFIG.colors.success}">Dominant</text>`;
        
        svgContent += '</svg>';
        svg.innerHTML = svgContent;
    }

    function updateICERTable() {
        const tbody = el('icerTableBody');
        if (!tbody) return;
        
        const wtp = state.wtpThreshold || 50000;
        
        calculateExpectedValues();
        
        // Calculate costs and effects
        const ceData = state.options.map((opt, i) => {
            const ev = state.results[opt]?.ev || 0;
            const cost = state.results[opt]?.expectedCost || (10000 + i * 5000);
            return { option: opt, effect: ev, cost: cost, index: i };
        });
        
        // Sort by cost
        ceData.sort((a, b) => a.cost - b.cost);
        const reference = ceData[0];
        
        let html = '';
        ceData.forEach((d, i) => {
            const incCost = d.cost - reference.cost;
            const incEffect = d.effect - reference.effect;
            
            // NMB = Effect * WTP - Cost
            const nmb = d.effect * wtp - d.cost;
            
            let icer = '—';
            let status = '';
            let statusClass = '';
            
            if (i === 0) {
                status = 'Reference';
                statusClass = '';
            } else if (incEffect <= 0 && incCost > 0) {
                status = 'Dominated';
                statusClass = 'color: #e74c3c;';
            } else if (incEffect > 0 && incCost <= 0) {
                status = 'Dominant';
                statusClass = 'color: #27ae60; font-weight: bold;';
            } else if (incEffect > 0) {
                icer = (incCost / incEffect).toFixed(0);
                const icerVal = incCost / incEffect;
                if (icerVal <= wtp) {
                    status = 'Cost-Effective';
                    statusClass = 'color: #27ae60;';
                } else {
                    status = 'Not Cost-Effective';
                    statusClass = 'color: #e74c3c;';
                }
            } else {
                status = 'Tradeoff';
                statusClass = 'color: #f39c12;';
            }
            
            html += `
                <tr>
                    <td>${esc(d.option)}</td>
                    <td>$${Math.round(d.cost).toLocaleString()}</td>
                    <td>${d.effect.toFixed(4)}</td>
                    <td>${icer === '—' ? icer : '$' + parseInt(icer).toLocaleString()}</td>
                    <td>$${Math.round(nmb).toLocaleString()}</td>
                    <td style="${statusClass}">${status}</td>
                </tr>
            `;
        });
        
        tbody.innerHTML = html;
    }
    
    /**
     * Draw Cost-Effectiveness Acceptability Curve (CEAC)
     * Shows probability each option is cost-effective across WTP range
     */
    function drawCEAC() {
        const svg = el('ceacSvg');
        if (!svg) return;
        
        const width = 700;
        const height = 300;
        const margins = { top: 30, right: 150, bottom: 50, left: 60 };
        const plotWidth = width - margins.left - margins.right;
        const plotHeight = height - margins.top - margins.bottom;
        
        // WTP range: 0 to 2x current threshold
        const maxWTP = Math.max(state.wtpThreshold * 2, 100000);
        const wtpSteps = 50;
        const wtpRange = Array.from({length: wtpSteps + 1}, (_, i) => (i / wtpSteps) * maxWTP);
        
        // For each WTP, calculate which option has highest NMB
        // In deterministic case, probability is 0 or 1
        // If PSA results available, use those for probabilistic CEAC
        
        const acceptabilityData = {};
        state.options.forEach(opt => {
            acceptabilityData[opt] = [];
        });
        
        if (state.psaResults && state.psaResults.samples && state.psaResults.samples.length > 0) {
            // Probabilistic CEAC using PSA results
            const n = state.psaResults.samples.length;
            
            wtpRange.forEach(wtp => {
                const counts = {};
                state.options.forEach(opt => counts[opt] = 0);
                
                for (let i = 0; i < n; i++) {
                    // Calculate NMB for each option at this iteration
                    let bestOpt = null;
                    let bestNMB = -Infinity;
                    
                    state.options.forEach(opt => {
                        const ev = state.psaResults.optionEVs[opt]?.[i] || 0;
                        const cost = state.psaResults.optionCosts?.[opt]?.[i] || 0;
                        const nmb = ev * wtp - cost;
                        
                        if (nmb > bestNMB) {
                            bestNMB = nmb;
                            bestOpt = opt;
                        }
                    });
                    
                    if (bestOpt) counts[bestOpt]++;
                }
                
                state.options.forEach(opt => {
                    acceptabilityData[opt].push({ wtp, prob: counts[opt] / n });
                });
            });
        } else {
            // Deterministic CEAC - probability is 0 or 1 based on NMB
            wtpRange.forEach(wtp => {
                calculateExpectedValues();
                
                let bestOpt = null;
                let bestNMB = -Infinity;
                
                state.options.forEach(opt => {
                    const ev = state.results[opt]?.ev || 0;
                    const cost = state.results[opt]?.expectedCost || 0;
                    const nmb = ev * wtp - cost;
                    
                    if (nmb > bestNMB) {
                        bestNMB = nmb;
                        bestOpt = opt;
                    }
                });
                
                state.options.forEach(opt => {
                    acceptabilityData[opt].push({ wtp, prob: opt === bestOpt ? 1 : 0 });
                });
            });
        }
        
        // Draw CEAC
        const xScale = (wtp) => margins.left + (wtp / maxWTP) * plotWidth;

    /**
     * Sample from a distribution
     */
    function sampleDistribution(param) {
        const dist = param.distribution || 'fixed';
        const distParams = param.distParams || {};
        
        switch (dist) {
            case 'fixed':
                return param.estimate;
                
            case 'beta': {
                const alpha = distParams.alpha || 2;
                const beta = distParams.beta || 5;
                return sampleBeta(alpha, beta);
            }
            
            case 'gamma': {
                const shape = distParams.shape || 2;
                const scale = distParams.scale || 1;
                return sampleGamma(shape, scale);
            }
            
            case 'normal': {
                const mu = distParams.mu || param.estimate;
                const sigma = distParams.sigma || 0.1;
                return sampleNormal(mu, sigma);
            }
            
            case 'lognormal': {
                const mu = distParams.mu || 0;
                const sigma = distParams.sigma || 0.5;
                return Math.exp(sampleNormal(mu, sigma));
            }
            
            case 'uniform': {
                const min = distParams.min || 0;
                const max = distParams.max || 1;
                return min + Math.random() * (max - min);
            }
            
            case 'triangular': {
                const min = distParams.min || 0;
                const mode = distParams.mode || param.estimate;
                const max = distParams.max || 1;
                return sampleTriangular(min, mode, max);
            }
            
            case 'exponential': {
                const lambda = distParams.lambda || 1;
                return -Math.log(1 - Math.random()) / lambda;
            }
            
            default:
                return param.estimate;
        }
    }
    
    // Random sampling helper functions
    function sampleNormal(mu, sigma) {
        // Box-Muller transform
        const u1 = Math.random();
        const u2 = Math.random();
        const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
        return mu + sigma * z;
    }
    
    function sampleBeta(alpha, beta) {
        // Using gamma samples
        const x = sampleGamma(alpha, 1);
        const y = sampleGamma(beta, 1);
        return x / (x + y);
    }
    
    function sampleGamma(shape, scale) {
        // Marsaglia and Tsang's method
        if (shape < 1) {
            return sampleGamma(shape + 1, scale) * Math.pow(Math.random(), 1 / shape);
        }
        
        const d = shape - 1/3;
        const c = 1 / Math.sqrt(9 * d);
        
        while (true) {
            let x, v;
            do {
                x = sampleNormal(0, 1);
                v = 1 + c * x;
            } while (v <= 0);
            
            v = v * v * v;
            const u = Math.random();
            
            if (u < 1 - 0.0331 * x * x * x * x) {
                return d * v * scale;
            }
            
            if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) {
                return d * v * scale;
            }
        }
    }
    
    function sampleTriangular(min, mode, max) {
        const u = Math.random();
        const fc = (mode - min) / (max - min);
        
        if (u < fc) {
            return min + Math.sqrt(u * (max - min) * (mode - min));
        } else {
            return max - Math.sqrt((1 - u) * (max - min) * (max - mode));
        }
    }
    
    /**
     * Run Probabilistic Sensitivity Analysis
     */
    function runPSA() {
        const statusEl = el('psaStatus');
        const resultsEl = el('psaResults');
        
        if (statusEl) statusEl.textContent = 'Running PSA...';
        
        const n = state.psaSettings.iterations;
        const results = {
            samples: [],
            optionEVs: {}
        };
        
        // Initialize option EV arrays
        state.options.forEach(opt => {
            results.optionEVs[opt] = [];
        });
        
        // Get base parameter IDs (non-formula parameters with distributions)
        const baseParams = Object.keys(state.parameters).filter(pid => {
            const param = state.parameters[pid];
            return param && !param.isFormula && param.distribution !== 'fixed';
        });
        
        // Run iterations
        setTimeout(() => {
            for (let i = 0; i < n; i++) {
                // Sample base parameters
                const sampledValues = {};
                
                baseParams.forEach(pid => {
                    sampledValues[pid] = sampleDistribution(state.parameters[pid]);
                });
                
                // Evaluate derived parameters using formulas
                state.paramOrder.forEach(pid => {
                    const param = state.parameters[pid];
                    if (param && param.isFormula && param.formula) {
                        const result = evaluateFormula(param.formula, sampledValues);
                        sampledValues[pid] = result.error ? (param.estimate || 0) : result.value;
                    } else if (!sampledValues[pid]) {
                        sampledValues[pid] = state.parameters[pid]?.estimate || 0;
                    }
                });
                
                // Calculate EV for each option with sampled values
                const { evs: optEVs, costs: optCosts } = calculateEVWithParams(sampledValues);
                
                state.options.forEach(opt => {
                    results.optionEVs[opt].push(optEVs[opt] || 0);
                    if (!results.optionCosts) results.optionCosts = {};
                    if (!results.optionCosts[opt]) results.optionCosts[opt] = [];
                    results.optionCosts[opt].push(optCosts[opt] || 0);
                });
                
                results.samples.push(sampledValues);
            }
            
            state.psaResults = results;
            
            // Calculate EVPI
            let evpi = 0;
            const baseCase = calculateExpectedValues();
            const baseBestEV = state.results.bestEV;
            
            for (let i = 0; i < n; i++) {
                const maxEV = Math.max(...state.options.map(opt => results.optionEVs[opt][i]));
                evpi += maxEV;
            }
            evpi = (evpi / n) - baseBestEV;
            
            state.psaResults.evpi = evpi;
            
            // Update display
            if (statusEl) statusEl.textContent = `Completed ${n} iterations`;
            if (resultsEl) resultsEl.style.display = 'block';
            
            updatePSADisplay();
        }, 10);
    }
    
    /**
     * Calculate expected values with specific parameter values
     * Uses the same disease-state model as calculateExpectedValues():
     * P(disease) * U(disease present | option) + P(no disease) * U(disease absent | option)
     */
    function calculateEVWithParams(params) {
        const evs = {};
        const costs = {};
        
        // Shared level probabilities, one utility per complete cascade path
        const paths = diseasePaths();
        const readProb = (paramId) => params[paramId] ?? paramOr(paramId, 0.3);

        state.options.forEach((opt, i) => {
            let ev = 0;
            paths.forEach(path => {
                const utilityId = pathUtilityParamId(i, path);
                const utility = params[utilityId] ?? paramOr(utilityId, pathUtilityDefault(path));
                ev += pathProbability(path, readProb) * utility;
            });
            evs[opt] = ev;

            // Get cost for this option (for CEA)
            costs[opt] = params[`cost_${i}`] ?? (10000 + i * 5000);
        });
        
        return { evs, costs };
    }

    /**
     * Calculate Expected Value of Partial Perfect Information (EVPPI)
     * For each parameter, calculate how much decision uncertainty would be resolved
     * if we had perfect information about that parameter alone.
     */
    function calculateEVPPI() {
        if (!state.psaResults || !state.psaResults.samples || state.psaResults.samples.length === 0) {
            alert('Please run PSA first to calculate EVPPI.');
            return;
        }
        
        const n = state.psaResults.samples.length;
        const evpi = state.psaResults.evpi || 0;
        
        // Get parameters that were actually sampled in PSA (have variation)
        // Check first sample to see what parameters exist
        const firstSample = state.psaResults.samples[0];
        const sampledParamIds = Object.keys(firstSample || {});
        
        // Filter to parameters that have actual variation in the samples
        const uncertainParams = sampledParamIds.filter(pid => {
            const values = state.psaResults.samples.map(s => s[pid]);
            const validValues = values.filter(v => v !== undefined && v !== null && !isNaN(v));
            if (validValues.length < 2) return false;
            const min = Math.min(...validValues);
            const max = Math.max(...validValues);
            return (max - min) > 0.0001; // Has meaningful variation
        });
        
        if (uncertainParams.length === 0) {
            alert('No uncertain parameters found in PSA results. Make sure parameters have distributions set.');
            return;
        }
        
        const evppiResults = [];
        
        // For each uncertain parameter, calculate EVPPI
        uncertainParams.forEach(paramId => {
            // Group samples by parameter value (binned)
            const paramValues = state.psaResults.samples.map(s => s[paramId]);
            const validValues = paramValues.filter(v => v !== undefined && v !== null && !isNaN(v));
            
            if (validValues.length < 2) {
                evppiResults.push({ paramId, label: getParamLabel(paramId), evppi: 0 });
                return;
            }
            
            const minVal = Math.min(...validValues);
            const maxVal = Math.max(...validValues);
            const range = maxVal - minVal;
            
            if (range < 0.0001) {
                // No variation in this parameter
                evppiResults.push({ paramId, label: getParamLabel(paramId), evppi: 0 });
                return;
            }
            
            // Create bins for this parameter
            const numBins = Math.min(20, Math.ceil(Math.sqrt(n)));
            const binWidth = range / numBins;
            const bins = Array(numBins).fill(null).map(() => ({ indices: [] }));
            
            // Assign samples to bins
            paramValues.forEach((val, idx) => {
                if (val === undefined || val === null || isNaN(val)) return;
                let binIdx = Math.floor((val - minVal) / binWidth);
                // Clamp to valid range
                if (isNaN(binIdx)) return;
                binIdx = Math.max(0, Math.min(numBins - 1, binIdx));
                if (bins[binIdx]) {
                    bins[binIdx].indices.push(idx);
                }
            });
            
            // Calculate expected value with perfect info about this parameter
            let evWithPerfectInfo = 0;
            let totalWeight = 0;
            
            bins.forEach(bin => {
                if (!bin || bin.indices.length === 0) return;
                
                const weight = bin.indices.length / n;
                totalWeight += weight;
                
                // Within this bin, find the option with highest expected EV
                const optionMeans = {};
                state.options.forEach(opt => {
                    let sum = 0;
                    let count = 0;
                    bin.indices.forEach(idx => {
                        const ev = state.psaResults.optionEVs[opt]?.[idx];
                        if (ev !== undefined && !isNaN(ev)) {
                            sum += ev;
                            count++;
                        }
                    });
                    optionMeans[opt] = count > 0 ? sum / count : 0;
                });
                
                const meanValues = Object.values(optionMeans);
                if (meanValues.length > 0) {
                    const maxMean = Math.max(...meanValues);
                    evWithPerfectInfo += weight * maxMean;
                }
            });
            
            // EVPPI = EV with perfect info about this param - EV without
            // Normalize if total weight < 1
            if (totalWeight > 0) {
                evWithPerfectInfo /= totalWeight;
            }
            
            // Get baseline expected value (from deterministic analysis)
            const baseEV = state.results.bestEV || 0;
            const paramEVPPI = Math.max(0, evWithPerfectInfo - baseEV);
            
            evppiResults.push({
                paramId,
                label: getParamLabel(paramId),
                evppi: paramEVPPI
            });
        });
        
        // Sort by EVPPI descending
        evppiResults.sort((a, b) => b.evppi - a.evppi);
        
        // Store results
        state.evppiResults = evppiResults;
        
        // Update display
        displayEVPPIResults(evppiResults, evpi);
    }

        svgContent += `<line x1="${margins.left}" y1="${margins.top + topResults.length * (barHeight + 5)}" 
            x2="${margins.left + plotWidth}" y2="${margins.top + topResults.length * (barHeight + 5)}" 
            stroke="#bdc3c7"/>`;
        svgContent += `<text x="${margins.left + plotWidth/2}" y="${height - 10}" 
            text-anchor="middle" font-size="10">EVPPI Value</text>`;
        
        svgContent += '</svg>';
