    function updatePSASummaryTable() {
        const tbody = el('psaSummaryBody');
        if (!tbody || !state.psaResults) return;
        
        let html = '';
        const n = state.psaSettings.iterations;
        
        state.options.forEach(opt => {
            const evs = state.psaResults.optionEVs[opt];
            const sorted = [...evs].sort((a, b) => a - b);
            const mean = evs.reduce((a, b) => a + b, 0) / n;
            const ci_low = sorted[Math.floor(n * 0.025)];
            const ci_high = sorted[Math.floor(n * 0.975)];
            
            // Calculate P(optimal)
            let pOptimal = 0;
            for (let i = 0; i < n; i++) {
                const thisEV = evs[i];
                const isOptimal = state.options.every(other => 
                    state.psaResults.optionEVs[other][i] <= thisEV
                );
                if (isOptimal) pOptimal++;
            }
            pOptimal /= n;
            
            html += `
                <tr>
                    <td>${esc(opt)}</td>
                    <td>${formatNumber(mean, 4)}</td>
                    <td>[${formatNumber(ci_low, 4)}, ${formatNumber(ci_high, 4)}]</td>
                    <td>${(pOptimal * 100).toFixed(1)}%</td>
                </tr>
            `;
        });
        
        tbody.innerHTML = html;
    }
    
    function drawCEScatterPlot() {
        const svg = el('ceScatterSvg');
        if (!svg || !state.psaResults) return;
        
        const width = 400;
        const height = 350;
        const margins = { top: 30, right: 30, bottom: 50, left: 70 };
        const plotWidth = width - margins.left - margins.right;
        const plotHeight = height - margins.top - margins.bottom;
        
        const n = state.psaSettings.iterations;
        const refOpt = state.options[0];
        const refIdx = 0;
        
        // Check if we have cost data
        const hasCosts = state.psaResults.optionCosts && state.psaResults.optionCosts[refOpt];
        
        let svgContent = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        
        // Title
        svgContent += `<text x="${width/2}" y="15" text-anchor="middle" font-size="12" font-weight="bold">
            Incremental Cost-Effectiveness Scatter Plot</text>`;
        
        if (!hasCosts || state.options.length < 2) {
            svgContent += `
                <text x="${width/2}" y="${height/2}" text-anchor="middle" font-size="11" fill="#7f8c8d">
                    ${state.options.length < 2 ? 'Need 2+ treatment options' : 'Enable CEA and add cost parameters'}
                </text>
            `;
            svgContent += '</svg>';
            svg.innerHTML = svgContent;
            return;
        }
        
        // Calculate incremental costs and effects for each non-reference option
        const scatterData = [];
        state.options.forEach((opt, optIdx) => {
            if (optIdx === refIdx) return;
            
            for (let i = 0; i < Math.min(n, 500); i++) { // Limit points for performance
                const incCost = state.psaResults.optionCosts[opt][i] - state.psaResults.optionCosts[refOpt][i];
                const incEffect = state.psaResults.optionEVs[opt][i] - state.psaResults.optionEVs[refOpt][i];
                scatterData.push({ opt, optIdx, incCost, incEffect, i });
            }
        });
        
        // Find axis ranges
        const costs = scatterData.map(d => d.incCost);
        const effects = scatterData.map(d => d.incEffect);
        
        const maxAbsCost = Math.max(Math.abs(Math.min(...costs)), Math.abs(Math.max(...costs)), 100);
        const maxAbsEffect = Math.max(Math.abs(Math.min(...effects)), Math.abs(Math.max(...effects)), 0.01);
        
        const xMin = -maxAbsEffect * 1.2;
        const xMax = maxAbsEffect * 1.2;
        const yMin = -maxAbsCost * 1.2;
        const yMax = maxAbsCost * 1.2;
        
        const xScale = (val) => margins.left + ((val - xMin) / (xMax - xMin)) * plotWidth;
        const yScale = (val) => margins.top + plotHeight - ((val - yMin) / (yMax - yMin)) * plotHeight;
        
        // Background quadrants
        const centerX = xScale(0);
        const centerY = yScale(0);
        
        // NW: dominated (more cost, less effect) - red
        svgContent += `<rect x="${margins.left}" y="${margins.top}" 
            width="${centerX - margins.left}" height="${centerY - margins.top}" 
            fill="rgba(231, 76, 60, 0.15)"/>`;
        
        // SE: dominant (less cost, more effect) - green
        svgContent += `<rect x="${centerX}" y="${centerY}" 
            width="${width - margins.right - centerX}" height="${height - margins.bottom - centerY}" 
            fill="rgba(39, 174, 96, 0.15)"/>`;
        
        // NE and SW: tradeoff - yellow
        svgContent += `<rect x="${centerX}" y="${margins.top}" 
            width="${width - margins.right - centerX}" height="${centerY - margins.top}" 
            fill="rgba(241, 196, 15, 0.15)"/>`;
        svgContent += `<rect x="${margins.left}" y="${centerY}" 
            width="${centerX - margins.left}" height="${height - margins.bottom - centerY}" 
            fill="rgba(241, 196, 15, 0.15)"/>`;
        
        // Axes
        svgContent += `<line x1="${margins.left}" y1="${centerY}" x2="${width - margins.right}" y2="${centerY}" stroke="#2c3e50" stroke-width="1"/>`;
        svgContent += `<line x1="${centerX}" y1="${margins.top}" x2="${centerX}" y2="${height - margins.bottom}" stroke="#2c3e50" stroke-width="1"/>`;
        
        // WTP threshold line (if CEA enabled)
        const wtp = state.wtpThreshold || 50000 || 50000;
        if (wtp > 0 && maxAbsEffect > 0) {
            const wtpX1 = xScale(0);
            const wtpY1 = yScale(0);
            const wtpX2 = xScale(maxAbsEffect);
            const wtpY2 = yScale(wtp * maxAbsEffect);
            
            svgContent += `<line x1="${wtpX1}" y1="${wtpY1}" x2="${wtpX2}" y2="${Math.max(margins.top, wtpY2)}" 
                stroke="${CONFIG.colors.purple}" stroke-width="2" stroke-dasharray="5,5"/>`;
            svgContent += `<text x="${wtpX2 - 5}" y="${Math.max(margins.top + 15, wtpY2 + 5)}" 
                font-size="9" fill="${CONFIG.colors.purple}" text-anchor="end">WTP=$${wtp.toLocaleString()}</text>`;
        }
        
        // Plot points
        scatterData.forEach(d => {
            const x = xScale(d.incEffect);
            const y = yScale(d.incCost);
            const color = CONFIG.colors.optionColors[d.optIdx % CONFIG.colors.optionColors.length];
            
            svgContent += `<circle cx="${x}" cy="${y}" r="2.5" fill="${color}" opacity="0.4"/>`;
        });
        
        // Axis labels
        svgContent += `<text x="${width/2}" y="${height - 5}" text-anchor="middle" font-size="10">Δ Effect (vs ${refOpt})</text>`;
        svgContent += `<text x="12" y="${height/2}" text-anchor="middle" font-size="10" transform="rotate(-90, 12, ${height/2})">Δ Cost</text>`;
        
        // Legend
        const legendY = margins.top + 5;
        state.options.forEach((opt, idx) => {
            if (idx === refIdx) return;
            const color = CONFIG.colors.optionColors[idx % CONFIG.colors.optionColors.length];
            svgContent += `<circle cx="${margins.left + 10}" cy="${legendY + (idx - 1) * 15}" r="4" fill="${color}"/>`;
            svgContent += `<text x="${margins.left + 20}" y="${legendY + (idx - 1) * 15 + 4}" font-size="9">${esc(opt)} vs ${esc(refOpt)}</text>`;
        });
        
        svgContent += '</svg>';
        svg.innerHTML = svgContent;
    }
    
    function drawCEAC() {
        const svg = el('ceacSvg');
        if (!svg || !state.psaResults) return;
        
        const width = 400;
        const height = 350;
        const margins = { top: 30, right: 80, bottom: 50, left: 60 };
        const plotWidth = width - margins.left - margins.right;
        const plotHeight = height - margins.top - margins.bottom;
        
        // Calculate P(cost-effective) at various WTP thresholds
        // For simple EV comparison (not full CE), just show P(optimal)
        const n = state.psaSettings.iterations;
        
        // For this simplified version, show P(best) curve for each option
        let svgContent = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        
        // Background
        svgContent += `<rect x="${margins.left}" y="${margins.top}" width="${plotWidth}" height="${plotHeight}" fill="#f8f9fa"/>`;
        
        // Axes
        svgContent += `<line x1="${margins.left}" y1="${margins.top + plotHeight}" x2="${margins.left + plotWidth}" y2="${margins.top + plotHeight}" stroke="#2c3e50" stroke-width="1"/>`;
        svgContent += `<line x1="${margins.left}" y1="${margins.top}" x2="${margins.left}" y2="${margins.top + plotHeight}" stroke="#2c3e50" stroke-width="1"/>`;
        
        // Y-axis: P(optimal) 0 to 1
        for (let p = 0; p <= 1; p += 0.25) {
            const y = margins.top + plotHeight * (1 - p);
            svgContent += `<text x="${margins.left - 5}" y="${y + 4}" text-anchor="end" font-size="10">${(p * 100).toFixed(0)}%</text>`;
            svgContent += `<line x1="${margins.left}" y1="${y}" x2="${margins.left + plotWidth}" y2="${y}" stroke="#ecf0f1" stroke-width="1"/>`;
        }
        
        // Calculate P(optimal) for each option
        state.options.forEach((opt, optIdx) => {
            const evs = state.psaResults.optionEVs[opt];
            let pOptimal = 0;
            
            for (let i = 0; i < n; i++) {
                const thisEV = evs[i];
                const isOptimal = state.options.every(other => 
                    state.psaResults.optionEVs[other][i] <= thisEV
                );
                if (isOptimal) pOptimal++;
            }
            pOptimal /= n;
            
            const x = margins.left + plotWidth * ((optIdx + 0.5) / state.options.length);
            const barHeight = pOptimal * plotHeight;
            const color = CONFIG.colors.optionColors[optIdx % CONFIG.colors.optionColors.length];
            
            svgContent += `<rect x="${x - 30}" y="${margins.top + plotHeight - barHeight}" width="60" height="${barHeight}" fill="${color}" opacity="0.7"/>`;
            svgContent += `<text x="${x}" y="${margins.top + plotHeight + 15}" text-anchor="middle" font-size="10">${esc(opt)}</text>`;
            svgContent += `<text x="${x}" y="${margins.top + plotHeight - barHeight - 5}" text-anchor="middle" font-size="10" fill="${color}">${(pOptimal * 100).toFixed(1)}%</text>`;
        });
        
        // Labels
        svgContent += `<text x="${width / 2}" y="${height - 5}" text-anchor="middle" font-size="11">Decision Option</text>`;
        svgContent += `<text x="12" y="${height / 2}" text-anchor="middle" font-size="11" transform="rotate(-90, 12, ${height / 2})">P(Optimal)</text>`;
        svgContent += `<text x="${width / 2}" y="${margins.top - 10}" text-anchor="middle" font-size="12" font-weight="bold">Probability of Being Optimal</text>`;
        
        svgContent += '</svg>';
        svg.innerHTML = svgContent;
    }

    /**
     * Export leaf states for Utility Assessment Suite
     * Creates a JSON file with all terminal outcome states
     */
    function exportLeafStates() {
        const leafStates = [];
        
        // One leaf per option per complete cascade path (2^N leaves per option)
        const paths = diseasePaths();
        state.options.forEach((opt, i) => {
            paths.forEach(path => {
                const states = pathStateLabels(path);
                leafStates.push({
                    name: `${opt} → ${states.join(' → ')}`,
                    option: opt,
                    diseaseStates: states,
                    utilityParam: pathUtilityParamId(i, path)
                });
            });
        });
        
        const exportData = {
            source: `Decision Tree Suite v${CONFIG.version}`,
            exportDate: new Date().toISOString(),
            modelName: state.modelName || 'Unnamed Model',
            context: {
                condition: getDiseaseNameForDisplay(0),
                treatment: state.options[0] || 'Treatment'
            },
            leafStates: leafStates,
            currentUtilities: (() => {
                const utils = {};
                state.options.forEach((opt, i) => {
                    diseasePaths().forEach(path => {
                        const id = pathUtilityParamId(i, path);
                        utils[id] = paramOr(id, pathUtilityDefault(path));
                    });
                });
                return utils;
            })()
        };
        
        const json = JSON.stringify(exportData, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        a.download = `leaf_states_for_utility_suite_${timestamp}.json`;
        a.click();
        URL.revokeObjectURL(url);
        
        alert('Leaf states exported! Open this file in the Utility Assessment Suite v02 to assess utilities.');
    }
    
    /**
     * Import utilities from Utility Assessment Suite
     */
    function importUtilities(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                
                // Validate format
                if (!data.utilities && !data.mfpa) {
                    alert('Invalid utility file format. Expected Utility Assessment Suite export.');
                    return;
                }
                
                // Store imported data
                state.importedUtilities = {
                    source: data.source || 'Utility Assessment Suite',
                    timestamp: data.timestamp,
                    method: data.preferredMethod || 'mean',
                    mfpa: data.mfpa,
                    utilities: data.utilities
                };
                
                // Ask user which method to use
                const methods = ['mean', 'vas', 'sg', 'tto'];
                const availableMethods = methods.filter(m => {
                    if (m === 'mean') return true;
                    return Object.values(data.utilities || {}).some(u => u[m] !== null && u[m] !== undefined);
                });
                
                let selectedMethod = data.preferredMethod || 'mean';
                if (availableMethods.length > 1) {
                    const methodChoice = prompt(
                        `Multiple utility methods available. Which to use?\n` +
                        `Options: ${availableMethods.join(', ')}\n` +
                        `(Enter one of: ${availableMethods.join(', ')})`,
                        selectedMethod
                    );
                    if (methodChoice && availableMethods.includes(methodChoice.toLowerCase())) {
                        selectedMethod = methodChoice.toLowerCase();
                    }
                }
                
                state.importedUtilities.method = selectedMethod;
                
                // Apply utilities to parameters
                // Try to match utility outcomes to our Good/Bad structure
                const utilities = data.utilities || {};
                let vGood = null, vBad = null;
                
                // Look for outcomes containing 'good' or 'bad'
                Object.keys(utilities).forEach(outcomeName => {
                    const u = utilities[outcomeName];
                    const utility = u[selectedMethod] ?? u.mean ?? u.vas ?? u.sg ?? u.tto;
                    
                    if (typeof utility === 'number') {
                        const nameLower = outcomeName.toLowerCase();
                        if (nameLower.includes('good') || nameLower.includes('best') || u.rank === Object.keys(utilities).length) {
                            vGood = utility;
                        } else if (nameLower.includes('bad') || nameLower.includes('worst') || u.rank === 1) {
                            vBad = utility;
                        }
                    }
                });
                
                // Apply to parameters if found - use alternative-specific IDs
                if (vGood !== null) {
                    state.options.forEach((opt, i) => {
                        if (!state.parameters[`v_good_${i}`]) state.parameters[`v_good_${i}`] = {};
                        state.parameters[`v_good_${i}`].estimate = vGood;
                    });
                }
                if (vBad !== null) {
                    state.options.forEach((opt, i) => {
                        if (!state.parameters[`v_bad_${i}`]) state.parameters[`v_bad_${i}`] = {};
                        state.parameters[`v_bad_${i}`].estimate = vBad;
                    });
                }
                
                // Apply MFPA if present
                if (data.mfpa !== undefined) {
                    state.wtpThreshold = data.mfpa;
                }
                
                // Rebuild UI
                buildPerspectivesSection();
                refreshAllDisplays();
                
                alert(`Utilities imported successfully!\n` +
                      `Method: ${selectedMethod}\n` +
                      `Disease absent: ${vGood?.toFixed(3) || 'not found'}\n` +
                      `Disease present: ${vBad?.toFixed(3) || 'not found'}\n` +
                      `MFPA: ${data.mfpa || 'not set'}`);
                
            } catch (err) {
                alert('Error importing utilities: ' + err.message);
                console.error(err);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }
    
    function exportModel() {
        // Read the metadata fields first. This used to happen *after* the prompt below,
        // which silently overwrote whatever name the user had just typed with the stale
        // contents of #modelNameInput -- so the file came out under the old name.
        const modelNameInput = document.getElementById('modelNameInput');
        if (modelNameInput) state.modelName = modelNameInput.value;
        const modelDateInput = document.getElementById('modelDateInput');
        if (modelDateInput) state.modelDate = modelDateInput.value;
        const modelAuthorInput = document.getElementById('modelAuthorInput');
        if (modelAuthorInput) state.modelAuthor = modelAuthorInput.value;

        // Prompt for model name, seeded with the current one
        const defaultName = state.modelName || 'decision_tree_model';
        const modelName = prompt('Enter a name for this model:', defaultName);
        if (modelName === null) return; // User cancelled

        // Save model name to state, and reflect it back into the visible field so the
        // form and the exported filename cannot disagree.
        state.modelName = (modelName || '').trim() || defaultName;
        if (modelNameInput) modelNameInput.value = state.modelName;
        
        // Sync all textarea values to state before export
        // Row comments
        ['perspective', 'structure', 'who', 'outcomes', 'uncertainties', 'options', 'valuations', 'time'].forEach(key => {
            const textarea = document.getElementById(`comment-${key}`);
            if (textarea) {
                state.rowComments[key] = textarea.value;
            }
        });
        
        // Analysis comments
        const analysisCommentIds = {
            'commentTree': 'tree',
            'commentRollback': 'rollback', 
            'commentSummary': 'summary',
            'commentTornado': 'tornado',
            'commentCEA': 'cea',
            'commentPSA': 'psa'
        };
        Object.entries(analysisCommentIds).forEach(([id, key]) => {
            const textarea = document.getElementById(id);
            if (textarea) {
                state.analysisComments[key] = textarea.value;
            }
        });
        
        // Sync overall description
        const descTextarea = document.getElementById('overallDescription');
        if (descTextarea) {
            state.overallDescription = descTextarea.value;
        }
        
        // Create export object with all state
        const exportData = {
            version: CONFIG.version,
            modelName: state.modelName,
            exportDate: new Date().toISOString(),
            title: CONFIG.title,
            state: JSON.parse(JSON.stringify(state)) // Deep clone
        };
        
        // Filename is <Model name>_<datetime>.json
        const now = new Date();
        const datetime = now.toISOString().replace(/[:.]/g, '-').slice(0, 19); // 2026-01-13T12-34-56
        // Collapse runs of illegal characters rather than mapping each to its own
        // underscore, and never let the name reduce to nothing.
        const safeName = String(state.modelName || '')
            .replace(/[^a-zA-Z0-9_-]+/g, '_')
            .replace(/^_+|_+$/g, '')
            .substring(0, 50) || 'decision_tree_model';
        const filename = `${safeName}_${datetime}.json`;
        
        // Create and trigger download
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function importModel(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importData = JSON.parse(e.target.result);
                
                // Validate
                if (!importData.state) {
                    alert('Invalid model file: missing state data');
                    return;
                }
                
                // Merge imported state with current state structure
                // (to handle any missing fields from older versions)
                const importedState = importData.state;
                
                // Update state
                state.skillLevel = importedState.skillLevel || 'novice';
                state.modelName = importedState.modelName || importData.modelName || '';
                state.modelDate = importedState.modelDate || new Date().toISOString().slice(0, 10);
                state.modelAuthor = importedState.modelAuthor || '';
                state.overallDescription = importedState.overallDescription || '';
                state.perspectiveMode = importedState.perspectiveMode || 'single';
                state.selectedPerspectives = importedState.selectedPerspectives || ['clinician'];
                state.perspectiveRows = importedState.perspectiveRows || [{ perspective: 'clinician', values: {} }];
                state.hasTest = importedState.hasTest || false;
                state.testPosition = importedState.testPosition || 'test_first';
                state.testName = importedState.testName || 'Diagnostic Test';
                state.isCEA = importedState.isCEA || false;
                state.selectedOutcomes = importedState.selectedOutcomes || ['utility'];
                state.selectedCostSubTypes = importedState.selectedCostSubTypes || [];
                state.intermediateOutcomes = importedState.intermediateOutcomes || [{ id: 'int_1', name: '<Disease>', states: ['<Disease>', '<No Disease>'] }];
                // Older saves stored states as ['Present','Absent']; re-derive the limb labels.
                syncDiseaseStates();
                state.showIntermediateOutcome = importedState.showIntermediateOutcome || false;
                state.showThreshold = importedState.showThreshold || false;
                state.options = importedState.options || ['Treatment A', 'Treatment B'];
                state.parameters = importedState.parameters || {};
                state.outcomeTradeoffs = importedState.outcomeTradeoffs || '';
                state.perspectiveTradeoffs = importedState.perspectiveTradeoffs || {};
                state.rowComments = importedState.rowComments || {
                    perspective: '', structure: '', who: '', outcomes: '',
                    uncertainties: '', options: '', valuations: '', time: ''
                };
                state.analysisComments = importedState.analysisComments || {
                    tree: '', rollback: '', summary: '', tornado: '', cea: '', psa: ''
                };
                
                // Update body class for skill level
                document.body.classList.remove('skill-novice', 'skill-beginner', 'skill-intermediate', 'skill-advanced');
                document.body.classList.add(`skill-${state.skillLevel}`);
                
                // Rebuild UI
                buildPerspectivesSection();
                updateAll();
                
                // Update analysis comment textareas
                if (el('commentTree')) el('commentTree').value = state.analysisComments.tree;
                if (el('commentRollback')) el('commentRollback').value = state.analysisComments.rollback;
                if (el('commentSummary')) el('commentSummary').value = state.analysisComments.summary;
                if (el('commentTornado')) el('commentTornado').value = state.analysisComments.tornado;
                if (el('commentCEA')) el('commentCEA').value = state.analysisComments.cea;
                if (el('commentPSA')) el('commentPSA').value = state.analysisComments.psa || '';
                
                // Update row comment textareas (buildPerspectivesSection already populates them, but ensure sync)
                ['perspective', 'structure', 'who', 'outcomes', 'uncertainties', 'options', 'valuations', 'time'].forEach(key => {
                    const textarea = el(`comment-${key}`);
                    if (textarea) textarea.value = state.rowComments[key] || '';
                });
                
                // Restore overall description
                if (el('overallDescription')) el('overallDescription').value = state.overallDescription || '';
                
                alert(`Model imported successfully!\nVersion: ${importData.version || 'unknown'}\nExported: ${importData.exportDate || 'unknown'}`);
                
            } catch (err) {
                alert('Error importing model: ' + err.message);
                console.error('Import error:', err);
            }
        };
        reader.readAsText(file);
        
        // Reset file input
        event.target.value = '';
    }

    /**
     * Export model in rdecision-compatible R format
     * Generates R code that can recreate the model using the rdecision package
     */
    function exportRdecision() {
        evaluateAllParameters();
        
        let rCode = `# rdecision Model Export
# Generated: ${new Date().toISOString()}
# From: ${CONFIG.title} v${CONFIG.version}

library(rdecision)

# ============================================
# PARAMETERS
# ============================================
`;

        // Export parameters
        Object.keys(state.parameters).forEach(paramId => {
            const param = state.parameters[paramId];
            const value = state.evaluatedParams[paramId] ?? param.estimate ?? 0;
            
            // Clean parameter name for R (replace invalid characters)
            const rName = paramId.replace(/[^a-zA-Z0-9_]/g, '_');
            
            if (param.isFormula) {
                rCode += `# ${rName} is derived: ${param.formula}\n`;
                rCode += `${rName} <- ${value}  # Evaluated value\n`;
            } else if (param.distribution && param.distribution !== 'fixed') {
                rCode += `# ${rName} distribution: ${param.distribution}\n`;
                rCode += `${rName} <- ModVar$new("${paramId}", "${param.distribution}", ${value})\n`;
            } else {
                rCode += `${rName} <- ${value}\n`;
            }
        });

        rCode += `
# ============================================
# DECISION TREE STRUCTURE
# ============================================

# Decision Node
decision_node <- DecisionNode$new(label = "Treatment Choice")

`;

        // This exporter emits a flat two-leaf chance node per option. When the model
        // has a deeper cascade it does NOT represent it, so say so in the output rather
        // than let the R code look like a faithful copy of the tree.
        const rLevels = diseaseLevelCount();
        if (rLevels > 1) {
            rCode += `# WARNING: this model has a ${rLevels}-level cascade (${diseasePaths().length} leaves per option).
# The export below collapses it to a single chance node using P(${getDiseaseNameForDisplay(0)})
# and does not carry the per-path utilities. Rebuild the deeper levels by hand.

`;
        }

        // Create nodes for each option
        state.options.forEach((opt, i) => {
            const optName = opt.replace(/[^a-zA-Z0-9_]/g, '_');
            rCode += `# Option: ${opt}\n`;
            rCode += `chance_${optName} <- ChanceNode$new(label = "${opt} Outcome")\n`;
            rCode += `leaf_${optName}_good <- LeafNode$new(label = "${opt} Success")\n`;
            rCode += `leaf_${optName}_bad <- LeafNode$new(label = "${opt} Failure")\n\n`;
        });

        rCode += `# ============================================
# ARROWS (Connections)
# ============================================

`;

        // Connect decision to options
        state.options.forEach((opt, i) => {
            const optName = opt.replace(/[^a-zA-Z0-9_]/g, '_');
            rCode += `arrow_d_${optName} <- Arrow$new(\n`;
            rCode += `  source = decision_node,\n`;
            rCode += `  target = chance_${optName},\n`;
            rCode += `  label = "${opt}"\n`;
            rCode += `)\n\n`;
        });

        // Connect chances to outcomes
        state.options.forEach((opt, i) => {
            const optName = opt.replace(/[^a-zA-Z0-9_]/g, '_');
            const pDisease = state.evaluatedParams['p_disease'] ?? 0.3;
            const pGood = 1 - pDisease;

            rCode += `arrow_${optName}_good <- Arrow$new(\n`;
            rCode += `  source = chance_${optName},\n`;
            rCode += `  target = leaf_${optName}_good,\n`;
            rCode += `  label = "Success",\n`;
            rCode += `  p = ${pGood}\n`;
            rCode += `)\n\n`;
            
            rCode += `arrow_${optName}_bad <- Arrow$new(\n`;
            rCode += `  source = chance_${optName},\n`;
            rCode += `  target = leaf_${optName}_bad,\n`;
            rCode += `  label = "Failure",\n`;
            rCode += `  p = ${1 - pGood}\n`;
            rCode += `)\n\n`;
        });

        rCode += `# ============================================
# BUILD AND EVALUATE TREE
# ============================================

# Collect all elements
nodes <- list(decision_node`;
        state.options.forEach((opt) => {
            const optName = opt.replace(/[^a-zA-Z0-9_]/g, '_');
            rCode += `,\n  chance_${optName}, leaf_${optName}_good, leaf_${optName}_bad`;
        });
        rCode += `)\n\narrows <- list(`;
        state.options.forEach((opt, i) => {
            const optName = opt.replace(/[^a-zA-Z0-9_]/g, '_');
            if (i > 0) rCode += `,`;
            rCode += `\n  arrow_d_${optName}, arrow_${optName}_good, arrow_${optName}_bad`;
        });
        rCode += `)\n\n`;

        rCode += `# Create decision tree
dt <- DecisionTree$new(
  V = nodes,
  E = arrows
)

# Evaluate
dt$evaluate()

# Print results
print(dt)
`;

        // Create and download file
        const timestamp = new Date().toISOString().slice(0, 10);
        const filename = `decision_tree_rdecision_${timestamp}.R`;
        
        const blob = new Blob([rCode], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ============================================
    // PUBLIC API
    // ============================================
    
    return {
        init: buildUI,
        
        // Skill level
        setSkillLevel,
        
        // Perspectives
        setPerspectiveMode,
        updatePerspective,
        updateSelectedPerspectives,
        addPerspectiveRow,
        removePerspectiveRow,
        updatePerspectiveRowValue,
        
        // Structure
        toggleTest,
        toggleCEA,
        toggleIntermediateOutcome,
        toggleThreshold,
        updateWTP,
        setTestPosition,
        updateTestName,
        
        // Custom Tree
        setTreeMode,
        loadPresetTree,
        showTreeEditor,
        parseTreeFromImage,
        evaluateCustomTree,
        
        // CEA
        drawCEAC,
        
        // Outcomes
        setSelectedOutcomes,
        updateSelectedOutcomes,
        updateSelectedCostSubTypes,
        addIntermediateOutcome,
        removeIntermediateOutcome,
        updateIntermediateOutcome,
        handleDiagramUpload,
        
        // Parameters
        updateParameter,
        refreshAllDisplays,
        toggleParameterRange,
        addCustomParameter,
        removeCustomParameter,
        updateCustomParamLabel,
        updateCustomParamVarName,
        updateDistParam,
        rebuildUncertainties,
        
        // Parameter Formulas
        toggleParamMode,
        setParamFormula,
        setParamDirect,
        previewFormula,
        evaluateAllParameters,
        
        // Options
        addOption,
        removeOption,
        updateOption,
        updateWho,
        
        // Tradeoffs
        updateOutcomeTradeoffs,
        updatePerspectiveTradeoff,
        
        // UI
        toggleInstructions,
        
        // Comments
        updateRowComment,
        updateAnalysisComment,
        updateOverallDescription,
        toggleTornadoZoom,
        toggleSensitivityZoom,
        
        // Documentation
        generateAbstract,
        generateResultSummary,
        
        // Export/Import
        exportModel,
        exportRdecision,
        importModel,
        exportLeafStates,
        importUtilities,
        
        // Analysis
        updateAll,
        updateCEA,
        
        // PSA
        updatePSASettings,
        runPSA,
        calculateEVPPI,
        updateAvailableParamsList,
        updateDependencyGraphDisplay,
        
        // Sensitivity
        showSensitivity,
        zoomToBase,
        zoomToThreshold,
        resetZoom,
        closeModal,
        
        // Debug
        getState: () => state,
        getConfig: () => CONFIG
    };
})();

// Auto-initialize
document.addEventListener('DOMContentLoaded', DT.init);
