    // ============================================
    // TREATMENT THRESHOLD (Kassirer-Pauker)
    // ============================================
    //
    // Setting EV(treat) = EV(do not treat) and solving for the prior:
    //
    //     p*B = (1-p)*C   =>   p* = C / (B + C)
    //
    //     C ("cost")    = u(no disease | no treatment) - u(no disease | treatment)
    //                     the harm of treating someone who does not have it
    //     B ("benefit") = u(disease | treatment) - u(disease | no treatment)
    //                     the gain from treating someone who does
    //
    // Option 0 is the treatment arm and option 1 the no-treatment arm, matching the
    // convention the test branch already uses (T+ -> option 0, T- -> option 1).
    function renderTreatmentThreshold() {
        const on = !!state.showThreshold;
        const shell = (inner) => `
            <div style="margin-top: 20px; padding: 15px; background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
                        border-radius: 8px; border: 1px solid #6366f1;">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                    <h4 style="color: #4338ca; margin: 0;">⚖️ Treatment Threshold</h4>
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 11px; cursor: pointer;">
                        <span style="${on ? 'color: #9ca3af;' : 'color: #374151; font-weight: bold;'}">Off</span>
                        <span class="toggle-switch">
                            <input type="checkbox" id="showThreshold" ${on ? 'checked' : ''}
                                   onchange="DT.toggleThreshold()">
                            <span class="toggle-slider"></span>
                        </span>
                        <span style="${on ? 'color: #4338ca; font-weight: bold;' : 'color: #9ca3af;'}">On</span>
                    </label>
                </div>
                ${inner ? `<div style="margin-top: 10px;">${inner}</div>` : ''}
            </div>`;
        const note = (text) => shell(`<p style="font-size: 11px; color: #7f8c8d; margin: 0;">${text}</p>`);

        if (!on) {
            const pair = state.options.length === 2
                ? `${esc(state.options[0])} and ${esc(state.options[1])}`
                : 'the alternatives';
            return note(`Switch on to compute the probability of
                         ${esc(getDiseaseStateLabels(0)[0])} at which ${pair} break even.`);
        }

        if (state.options.length !== 2) {
            return note(`Defined for two alternatives (treat vs. do not treat). This model has
                         ${state.options.length}, so there is no single crossover probability.`);
        }
        if (diseaseLevelCount() !== 1) {
            return note(`Defined for a single ${getIntermediateLabelText().toLowerCase()}. This model
                         cascades ${diseaseLevelCount()} of them, so the threshold is not one number.`);
        }

        const [presentLabel, absentLabel] = getDiseaseStateLabels(0);
        const txName = state.options[0];
        const noTxName = state.options[1];

        const uPresentTx = paramOr('v_bad_0', 0.3);
        const uPresentNoTx = paramOr('v_bad_1', 0.3);
        const uAbsentTx = paramOr('v_good_0', 0.9);
        const uAbsentNoTx = paramOr('v_good_1', 0.9);

        const cost = uAbsentNoTx - uAbsentTx;
        const benefit = uPresentTx - uPresentNoTx;
        const denom = benefit + cost;

        const u = (x) => Number(x).toFixed(2);
        const d = (x) => (x < 0 ? `(${Number(x).toFixed(2)})` : Number(x).toFixed(2));

        const symbolic = `
            <div style="font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #312e81;
                        background: white; padding: 10px; border-radius: 6px; overflow-x: auto;">
                <div>P*(${esc(presentLabel)}) = Cost / (Benefit + Cost)</div>
                <div style="margin-top: 6px;">
                    Cost&nbsp;&nbsp;&nbsp; = u(${esc(absentLabel)} | ${esc(noTxName)}) &minus; u(${esc(absentLabel)} | ${esc(txName)})
                    = ${u(uAbsentNoTx)} &minus; ${u(uAbsentTx)} = ${d(cost)}
                </div>
                <div>
                    Benefit = u(${esc(presentLabel)} | ${esc(txName)}) &minus; u(${esc(presentLabel)} | ${esc(noTxName)})
                    = ${u(uPresentTx)} &minus; ${u(uPresentNoTx)} = ${d(benefit)}
                </div>
            </div>`;

        if (Math.abs(denom) < 1e-12) {
            return shell(symbolic + `<p style="font-size: 11px; color: #b45309; margin: 10px 0 0 0;">
                Benefit + Cost = 0, so the two alternatives never cross and there is no threshold.</p>`);
        }

        const threshold = cost / denom;
        const inRange = threshold > 0 && threshold < 1;

        let caution = '';
        if (benefit <= 0 && cost > 0) {
            caution = `${esc(txName)} never improves the ${esc(presentLabel)} outcome and costs utility when
                       ${esc(absentLabel)}, so ${esc(noTxName)} wins at every probability.`;
        } else if (cost <= 0 && benefit > 0) {
            caution = `${esc(txName)} costs nothing when ${esc(absentLabel)} and helps when ${esc(presentLabel)},
                       so it wins at every probability.`;
        } else if (!inRange) {
            caution = `That falls outside 0-1, so one alternative dominates across the whole range.`;
        }

        return shell(symbolic + `
            <div style="margin-top: 10px; font-size: 13px; color: #312e81;">
                = ${d(cost)} / (${d(benefit)} + ${d(cost)})
                = <strong style="font-size: 16px; color: #4338ca;">${threshold.toFixed(4)}</strong>
                ${inRange ? `<span style="color: #6b7280;">(${(threshold * 100).toFixed(1)}%)</span>` : ''}
            </div>
            ${inRange ? `<p style="font-size: 11px; color: #4b5563; margin: 8px 0 0 0;">
                Choose <strong>${esc(txName)}</strong> when P(${esc(presentLabel)}) is above
                ${threshold.toFixed(4)}, and <strong>${esc(noTxName)}</strong> when it is below.</p>` : ''}
            ${caution ? `<p style="font-size: 11px; color: #b45309; margin: 8px 0 0 0;">${caution}</p>` : ''}`);
    }

    function refreshThresholdPanel() {
        const host = el('treatmentThresholdPanel');
        if (host) host.innerHTML = renderTreatmentThreshold();
    }

    function toggleThreshold() {
        const box = el('showThreshold');
        state.showThreshold = box ? box.checked : !state.showThreshold;
        refreshThresholdPanel();
    }

    function buildPerspectiveTradeoffTable() {
        const perspectives = state.selectedPerspectives.map(pId => 
            CONFIG.perspectives.find(p => p.id === pId)
        ).filter(Boolean);
        
        if (perspectives.length < 2) return '';

    /**
     * Evaluate a custom tree and find optimal decision
     * Uses depth-first traversal with rollback
     */
    function evaluateCustomTree() {
        if (!state.customTree.rootId || state.customTree.nodes.length === 0) {
            return null;
        }
        
        // Ensure parameters are evaluated
        evaluateAllParameters();
        
        // Build node lookup
        const nodeMap = {};
        state.customTree.nodes.forEach(n => nodeMap[n.id] = n);
        
        // Build edge lookup (children of each node)
        const childEdges = {};
        state.customTree.edges.forEach(e => {
            if (!childEdges[e.from]) childEdges[e.from] = [];
            childEdges[e.from].push(e);
        });
        
        // Recursive evaluation function
        function evalNode(nodeId) {
            const node = nodeMap[nodeId];
            if (!node) return { ev: 0, cost: 0 };
            
            const edges = childEdges[nodeId] || [];
            
            if (node.type === 'terminal') {
                // Evaluate payoff expression
                const ev = evaluateExpression(node.payoff || '0');
                return { ev, cost: 0, label: node.label };
            }
            
            if (node.type === 'chance') {
                // Expected value = sum of p_i * EV_i
                let totalEV = 0;
                let totalCost = 0;
                
                edges.forEach(edge => {
                    const prob = evaluateExpression(edge.probability || '0.5');
                    const childResult = evalNode(edge.to);
                    const edgeCost = evaluateExpression(edge.cost || '0');
                    
                    totalEV += prob * childResult.ev;
                    totalCost += prob * (edgeCost + childResult.cost);
                });
                
                return { ev: totalEV, cost: totalCost };
            }
            
            if (node.type === 'decision') {
                // Choose branch with highest EV (or lowest cost, or best ICER)
                let bestEV = -Infinity;
                let bestCost = 0;
                let bestEdge = null;
                
                edges.forEach(edge => {
                    const childResult = evalNode(edge.to);
                    const edgeCost = evaluateExpression(edge.cost || '0');
                    const totalCost = edgeCost + childResult.cost;
                    
                    if (childResult.ev > bestEV) {
                        bestEV = childResult.ev;
                        bestCost = totalCost;
                        bestEdge = edge;
                    }
                });
                
                return { 
                    ev: bestEV, 
                    cost: bestCost, 
                    bestAction: bestEdge?.label,
                    allActions: edges.map(e => ({
                        label: e.label,
                        ...evalNode(e.to)
                    }))
                };
            }
            
            return { ev: 0, cost: 0 };
        }
        
        return evalNode(state.customTree.rootId);
    }
    
    /**
     * Evaluate a mathematical expression with parameters
     */
    function evaluateExpression(expr) {
        if (typeof expr === 'number') return expr;
        if (!expr || expr === '0') return 0;
        
        try {
            // Replace parameter names with their values
            let evalExpr = expr.toString();
            
            // Get all parameter values
            const allParams = { ...state.evaluatedParams };
            Object.keys(state.parameters).forEach(pid => {
                if (allParams[pid] === undefined) {
                    allParams[pid] = getParamValue(pid);
                }
            });
            
            // Replace parameter names (longest first to avoid partial matches)
            const sortedParams = Object.keys(allParams).sort((a, b) => b.length - a.length);
            sortedParams.forEach(paramId => {
                const value = allParams[paramId] ?? 0;
                // Use word boundary regex to avoid partial matches
                const regex = new RegExp(`\\b${paramId}\\b`, 'g');
                evalExpr = evalExpr.replace(regex, `(${value})`);
            });
            
            // Evaluate the expression
            // Safe eval using Function constructor
            const result = new Function(`return ${evalExpr}`)();
            return isNaN(result) ? 0 : result;
        } catch (e) {
            console.warn('Expression evaluation error:', expr, e);
            return 0;
        }
    }
    
    /**
     * Draw custom tree diagram
     */
    function drawCustomTree() {
        const svg = el('treeSvg');
        if (!svg) return;
        
        if (state.customTree.nodes.length === 0) {
            svg.innerHTML = '<svg viewBox="0 0 700 200"><text x="350" y="100" text-anchor="middle" fill="#7f8c8d">No custom tree loaded</text></svg>';
            return;
        }
        
        // Build node and edge lookups
        const nodeMap = {};
        state.customTree.nodes.forEach(n => nodeMap[n.id] = n);
        
        const childEdges = {};
        state.customTree.edges.forEach(e => {
            if (!childEdges[e.from]) childEdges[e.from] = [];
            childEdges[e.from].push(e);
        });
        
        // Calculate tree layout using recursive positioning
        const nodePositions = {};
        const levelWidth = 180;
        const nodeRadius = 14;
        
        function countLeaves(nodeId) {
            const edges = childEdges[nodeId] || [];
            if (edges.length === 0) return 1;
            return edges.reduce((sum, e) => sum + countLeaves(e.to), 0);
        }
        
        function layoutNode(nodeId, x, yStart, yEnd) {
            const node = nodeMap[nodeId];
            if (!node) return;
            
            const y = (yStart + yEnd) / 2;
            nodePositions[nodeId] = { x, y };
            
            const edges = childEdges[nodeId] || [];
            if (edges.length === 0) return;
            
            const totalLeaves = edges.reduce((sum, e) => sum + countLeaves(e.to), 0);
            let currentY = yStart;
            
            edges.forEach(edge => {
                const leaves = countLeaves(edge.to);
                const height = (yEnd - yStart) * (leaves / totalLeaves);
                layoutNode(edge.to, x + levelWidth, currentY, currentY + height);
                currentY += height;
            });
        }
        
        // Calculate required height
        const totalLeaves = countLeaves(state.customTree.rootId);
        const minHeight = Math.max(300, totalLeaves * 60);
        const height = minHeight;
        const width = 900;
        
        layoutNode(state.customTree.rootId, 80, 40, height - 40);
        
        // Generate SVG
        let svgContent = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        
        // Draw edges first (so nodes appear on top)
        state.customTree.edges.forEach(edge => {
            const fromPos = nodePositions[edge.from];
            const toPos = nodePositions[edge.to];
            if (!fromPos || !toPos) return;
            
            const fromNode = nodeMap[edge.from];
            const toNode = nodeMap[edge.to];
            
            // Draw edge line
            svgContent += `<line x1="${fromPos.x + nodeRadius}" y1="${fromPos.y}" 
                                x2="${toPos.x - nodeRadius}" y2="${toPos.y}" 
                                stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
            
            // Edge label (action/outcome name)
            const midX = (fromPos.x + toPos.x) / 2;
            const midY = (fromPos.y + toPos.y) / 2;
            svgContent += `<text x="${midX}" y="${midY - 5}" text-anchor="middle" 
                                font-size="10" fill="${CONFIG.colors.dark}">${edge.label || ''}</text>`;
            
            // Probability label for chance node children
            if (fromNode?.type === 'chance' && edge.probability) {
                const probValue = evaluateExpression(edge.probability);
                svgContent += `<text x="${midX}" y="${midY + 12}" text-anchor="middle" 
                                    font-size="9" fill="${CONFIG.colors.success}">${probValue.toFixed(3)}</text>`;
            }
        });
        
        // Draw nodes
        state.customTree.nodes.forEach(node => {
            const pos = nodePositions[node.id];
            if (!pos) return;
            
            if (node.type === 'decision') {
                // Square node
                svgContent += `<rect x="${pos.x - nodeRadius}" y="${pos.y - nodeRadius}" 
                                    width="${nodeRadius * 2}" height="${nodeRadius * 2}" 
                                    fill="${CONFIG.colors.primary}" stroke="#2c3e50" stroke-width="2"/>`;
                svgContent += `<text x="${pos.x}" y="${pos.y + 4}" text-anchor="middle" 
                                    font-size="9" fill="white" font-weight="bold">D</text>`;
            } else if (node.type === 'chance') {
                // Circle node
                svgContent += `<circle cx="${pos.x}" cy="${pos.y}" r="${nodeRadius}" 
                                    fill="${CONFIG.colors.danger}" stroke="#c0392b" stroke-width="2"/>`;
                svgContent += `<text x="${pos.x}" y="${pos.y + 4}" text-anchor="middle" 
                                    font-size="9" fill="white" font-weight="bold">C</text>`;
            } else if (node.type === 'terminal') {
                // Triangle node
                svgContent += `<polygon points="${pos.x + 12},${pos.y} ${pos.x - 6},${pos.y - 10} ${pos.x - 6},${pos.y + 10}" 
                                    fill="${CONFIG.colors.success}"/>`;
                // Payoff value
                const payoff = evaluateExpression(node.payoff || '0');
                svgContent += `<text x="${pos.x + 20}" y="${pos.y + 4}" font-size="10" 
                                    fill="${CONFIG.colors.success}" font-weight="bold">${payoff.toFixed(3)}</text>`;
            }
            
            // Node label (above node)
            if (node.label && node.type !== 'terminal') {
                svgContent += `<text x="${pos.x}" y="${pos.y - nodeRadius - 5}" text-anchor="middle" 
                                    font-size="9" fill="${CONFIG.colors.dark}">${esc(node.label)}</text>`;
            }
        });
        
        svgContent += '</svg>';
        svg.innerHTML = svgContent;
    }
    
    /**
     * Draw custom tree with rollback values
     */
    function drawCustomRollbackTree() {
        const svg = el('rollbackSvg');
        if (!svg) return;
        
        if (state.customTree.nodes.length === 0) {
            svg.innerHTML = '<svg viewBox="0 0 700 200"><text x="350" y="100" text-anchor="middle" fill="#7f8c8d">No custom tree loaded</text></svg>';
            return;
        }
        
        // Evaluate tree first
        const result = evaluateCustomTree();
        if (!result) return;
        
        // Build node and edge lookups
        const nodeMap = {};
        state.customTree.nodes.forEach(n => nodeMap[n.id] = n);
        
        const childEdges = {};
        state.customTree.edges.forEach(e => {
            if (!childEdges[e.from]) childEdges[e.from] = [];
            childEdges[e.from].push(e);
        });
        
        // Calculate EVs for each node using recursion
        const nodeEVs = {};
        function calcNodeEV(nodeId) {
            const node = nodeMap[nodeId];
            if (!node) return 0;
            
            const edges = childEdges[nodeId] || [];
            
            if (node.type === 'terminal') {
                const ev = evaluateExpression(node.payoff || '0');
                nodeEVs[nodeId] = ev;
                return ev;
            }
            
            if (node.type === 'chance') {
                let totalEV = 0;
                edges.forEach(edge => {
                    const prob = evaluateExpression(edge.probability || '0.5');
                    totalEV += prob * calcNodeEV(edge.to);
                });
                nodeEVs[nodeId] = totalEV;
                return totalEV;
            }
            
            if (node.type === 'decision') {
                let bestEV = -Infinity;
                edges.forEach(edge => {
                    const childEV = calcNodeEV(edge.to);
                    if (childEV > bestEV) bestEV = childEV;
                });
                nodeEVs[nodeId] = bestEV;
                return bestEV;
            }
            
            return 0;
        }
        calcNodeEV(state.customTree.rootId);
        
        // Find best action at root
        const rootEdges = childEdges[state.customTree.rootId] || [];
        let bestAction = null;
        let bestActionEV = -Infinity;
        rootEdges.forEach(edge => {
            const ev = nodeEVs[edge.to];
            if (ev > bestActionEV) {
                bestActionEV = ev;
                bestAction = edge.label;
            }
        });
        
        // Layout (same as drawCustomTree)
        const nodePositions = {};
        const levelWidth = 180;
        const nodeRadius = 14;
        
        function countLeaves(nodeId) {
            const edges = childEdges[nodeId] || [];
            if (edges.length === 0) return 1;
            return edges.reduce((sum, e) => sum + countLeaves(e.to), 0);
        }
        
        function layoutNode(nodeId, x, yStart, yEnd) {
            const node = nodeMap[nodeId];
            if (!node) return;
            
            const y = (yStart + yEnd) / 2;
            nodePositions[nodeId] = { x, y };
            
            const edges = childEdges[nodeId] || [];
            if (edges.length === 0) return;
            
            const totalLeaves = edges.reduce((sum, e) => sum + countLeaves(e.to), 0);
            let currentY = yStart;
            
            edges.forEach(edge => {
                const leaves = countLeaves(edge.to);
                const height = (yEnd - yStart) * (leaves / totalLeaves);
                layoutNode(edge.to, x + levelWidth, currentY, currentY + height);
                currentY += height;
            });
        }
        
        const totalLeaves = countLeaves(state.customTree.rootId);
        const minHeight = Math.max(300, totalLeaves * 60);
        const height = minHeight;
        const width = 900;
        
        layoutNode(state.customTree.rootId, 80, 60, height - 40);
        
        // Generate SVG
        let svgContent = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        
        // Title
        svgContent += `<text x="${width / 2}" y="25" text-anchor="middle" font-size="14" 
                            fill="${CONFIG.colors.success}" font-weight="bold">
                            Best Action: ${bestAction || 'N/A'} (EV = ${bestActionEV.toFixed(4)})</text>`;
        
        // Draw edges
        state.customTree.edges.forEach(edge => {
            const fromPos = nodePositions[edge.from];
            const toPos = nodePositions[edge.to];
            if (!fromPos || !toPos) return;
            
            const fromNode = nodeMap[edge.from];
            const isBestPath = fromNode?.type === 'decision' && 
                              nodeEVs[edge.to] === nodeEVs[edge.from];
            
            const lineStyle = isBestPath 
                ? `stroke="${CONFIG.colors.success}" stroke-width="3"` 
                : `stroke="${CONFIG.colors.dark}" stroke-width="1.5" stroke-dasharray="5,3"`;
            
            svgContent += `<line x1="${fromPos.x + nodeRadius}" y1="${fromPos.y}" 
                                x2="${toPos.x - nodeRadius}" y2="${toPos.y}" ${lineStyle}/>`;
            
            // Edge labels
            const midX = (fromPos.x + toPos.x) / 2;
            const midY = (fromPos.y + toPos.y) / 2;
            svgContent += `<text x="${midX}" y="${midY - 5}" text-anchor="middle" 
                                font-size="10" fill="${CONFIG.colors.dark}">${edge.label || ''}</text>`;
            
            if (fromNode?.type === 'chance' && edge.probability) {
                const probValue = evaluateExpression(edge.probability);
                svgContent += `<text x="${midX}" y="${midY + 12}" text-anchor="middle" 
                                    font-size="9" fill="${CONFIG.colors.success}">${probValue.toFixed(3)}</text>`;
            }

        state.testName = name;
        scheduleSectionRebuild(drawBasicTree); // keeps focus while redrawing
    }

    function setSelectedOutcomes(outcomes) {
        const allowed = state.skillLevel === 'novice' ? ['utility', 'cost'] : state.skillLevel === 'beginner' ? ['utility', 'cost'] : CONFIG.outcomeTypes.map(o => o.id);
        state.selectedOutcomes = (outcomes || []).filter(o => allowed.includes(o));
        if (state.selectedOutcomes.length === 0) {
            state.selectedOutcomes = [state.skillLevel === 'novice' ? 'utility' : 'utility'];
        }
        if (state.skillLevel === 'novice' && state.selectedOutcomes.length > 1) {
            state.selectedOutcomes = [state.selectedOutcomes[0]];
        }
        if (state.skillLevel === 'beginner' && state.selectedOutcomes.length > 2) {
            state.selectedOutcomes = state.selectedOutcomes.slice(0, 2);
        }
        if (!state.selectedOutcomes.includes('cost')) {
            state.selectedCostSubTypes = [];
        }
        checkCEAStatus();
        scheduleSectionRebuild();
    }

    function updateSelectedOutcomes() {
        const allowed = state.skillLevel === 'novice' ? ['utility', 'cost'] : state.skillLevel === 'beginner' ? ['utility', 'cost'] : CONFIG.outcomeTypes.map(o => o.id);
        state.selectedOutcomes = getCheckedValues('outcomeCheck').filter(o => allowed.includes(o));
        if (state.selectedOutcomes.length === 0) {
            state.selectedOutcomes = ['utility'];
        }
        if (state.skillLevel === 'novice' && state.selectedOutcomes.length > 1) {
            state.selectedOutcomes = [state.selectedOutcomes[0]];
        }
        if (state.skillLevel === 'beginner' && state.selectedOutcomes.length > 2) {
            state.selectedOutcomes = state.selectedOutcomes.slice(0, 2);
        }
        if (!state.selectedOutcomes.includes('cost')) {
            state.selectedCostSubTypes = [];
        }
        checkCEAStatus();
        scheduleSectionRebuild();
    }

    function updateSelectedCostSubTypes() {
        state.selectedCostSubTypes = getCheckedValues('costSubType');
    }

    function checkCEAStatus() {
        // Auto-enable CEA if more than one outcome is selected (Beginner/Intermediate)
        // Also require Cost to be one of the selected outcomes
        if (state.skillLevel !== 'novice') {
            const hasCost = state.selectedOutcomes.includes('cost');
            const hasEffect = state.selectedOutcomes.some(o => o !== 'cost');
            const shouldBeCEA = hasCost && hasEffect && state.selectedOutcomes.length > 1;
            
            if (state.isCEA !== shouldBeCEA) {
                state.isCEA = shouldBeCEA;
                // Update the CEA checkbox if it exists
                const ceaCheckbox = el('isCEA');
                if (ceaCheckbox) {
                    ceaCheckbox.checked = shouldBeCEA;
                }
                // Show/hide CEA section
                const ceaSection = el('ceaSection');
                if (ceaSection) {
                    ceaSection.style.display = shouldBeCEA ? 'block' : 'none';
                }
                // Rebuild UI when CEA status changes
                // Save current comment values before rebuild
                const savedComments = {
                    tree: el('commentTree')?.value || state.analysisComments.tree,
                    rollback: el('commentRollback')?.value || state.analysisComments.rollback,
                    summary: el('commentSummary')?.value || state.analysisComments.summary,
                    tornado: el('commentTornado')?.value || state.analysisComments.tornado,
                    cea: el('commentCEA')?.value || state.analysisComments.cea
                };
                state.analysisComments = savedComments;
                buildUI();
            }
        }
    }

    function addIntermediateOutcome() {
        const newId = `int_${state.intermediateOutcomes.length + 1}`;
        state.intermediateOutcomes.push({
            id: newId,
            name: '<Disease>',
            states: ['<Disease>', '<No Disease>']
        });

            buildPerspectivesSection();

    }

    function updateIntermediateOutcome(index, key, value) {
        if (state.intermediateOutcomes[index]) {
            if (key === 'name') {
                const nextValue = String(value ?? '').trim();
                state.intermediateOutcomes[index][key] = nextValue || '<Disease>';

    // Debounce timer for auto-updates
    let updateDebounceTimer = null;
    
    function updateParameter(paramId, key, value) {
        if (!state.parameters[paramId]) {
            state.parameters[paramId] = {};
        }
        state.parameters[paramId][key] = value;

        if (key === 'estimate') {
            const estimate = Number(value);
            const min = Number(state.parameters[paramId].min);
            const max = Number(state.parameters[paramId].max);
            if (!Number.isNaN(estimate)) {
                if (!Number.isNaN(min) && estimate < min) {
                    state.parameters[paramId].min = String(estimate);
                }
                if (!Number.isNaN(max) && estimate > max) {
                    state.parameters[paramId].max = String(estimate);
                }
            }
            state.analysisUpdated = false;
        }
        
        // Auto-update trees when estimate changes (debounced)
        if (key === 'estimate') {
            clearTimeout(updateDebounceTimer);
            updateDebounceTimer = setTimeout(() => {
                refreshAllDisplays();
            }, 150);
        }
    }
    
    // Central function to refresh all displays
    function refreshAllDisplays() {
        try {
            // Clear evaluated params so they get recalculated
            state.evaluatedParams = {};
            
            // Recalculate and redraw
            calculateExpectedValues();
            drawBasicTree();
            updateSummaryTable();
            refreshThresholdPanel();
        } catch (err) {
            console.error('Error in refreshAllDisplays:', err);
        }
    }

    function toggleParameterRange(paramId) {
        if (!state.parameters[paramId]) {
            state.parameters[paramId] = {};
        }
        state.parameters[paramId].hasRange = !state.parameters[paramId].hasRange;
        
        // Auto-populate min/max when range is enabled
        if (state.parameters[paramId].hasRange) {
            const estimate = state.parameters[paramId].estimate || 0;
            const isProbability = paramId.startsWith('p_') || paramId === 'test_sens' || paramId === 'test_spec';
            
            if (isProbability) {
                // For probabilities, use 0-1 range or ±20% clamped to 0-1
                state.parameters[paramId].min = Math.max(0, estimate - 0.2).toFixed(2);
                state.parameters[paramId].max = Math.min(1, estimate + 0.2).toFixed(2);
            } else if (paramId.startsWith('v_')) {
                // For utilities, use ±0.2 clamped to 0-1
                state.parameters[paramId].min = Math.max(0, estimate - 0.2).toFixed(2);
                state.parameters[paramId].max = Math.min(1, estimate + 0.2).toFixed(2);
            } else if (paramId.startsWith('cost')) {
                // For costs, use ±50%
                state.parameters[paramId].min = (estimate * 0.5).toFixed(0);
                state.parameters[paramId].max = (estimate * 1.5).toFixed(0);
            } else {
                // Default: ±20%
                state.parameters[paramId].min = (estimate * 0.8).toFixed(2);
                state.parameters[paramId].max = (estimate * 1.2).toFixed(2);
            }
        }
        
        rebuildUncertainties();
    }

    function updateDistParam(paramId, key, value) {
        if (!state.parameters[paramId]) {
            state.parameters[paramId] = {};
        }
        if (!state.parameters[paramId].distParams) {
            state.parameters[paramId].distParams = {};
        }
        state.parameters[paramId].distParams[key] = value;
    }

    // Custom parameter management
    function addCustomParameter() {
        state.customParamCounter++;
        const paramId = `custom_${state.customParamCounter}`;
        const label = `Custom Param ${state.customParamCounter}`;
        const varName = `custom_${state.customParamCounter}`;
        
        state.customParams[paramId] = {
            label: label,
            varName: varName,
            value: 1.0
        };
        
        state.parameters[paramId] = {

            hasRange: false,
            min: '',
            max: '',
            distribution: 'fixed',
            distParams: {},
            isFormula: false,
            formula: '',
            citation: '',
            isCustom: true
        };
        
        buildPerspectivesSection();
    }
    
    function removeCustomParameter(paramId) {
        delete state.customParams[paramId];
        delete state.parameters[paramId];
        buildPerspectivesSection();
    }
    
    function updateCustomParamLabel(paramId, newLabel) {
        if (state.customParams[paramId]) {
            state.customParams[paramId].label = newLabel;
        }
    }
    
    function updateCustomParamVarName(paramId, newVarName) {
        if (state.customParams[paramId]) {
            // Sanitize variable name: remove spaces, special chars, make valid identifier
            const sanitized = newVarName
                .replace(/[^a-zA-Z0-9_]/g, '_')  // Replace invalid chars with underscore
                .replace(/^[0-9]/, '_$&');       // Prepend underscore if starts with number
            
            state.customParams[paramId].varName = sanitized || paramId;
            
            // Rebuild to update the parameter ID alias mapping
            buildPerspectivesSection();
        }
    }

    // ============================================
    // TREE DRAWING (Right-angle branches)
    // ============================================
    
    function drawBasicTree() {
        const svg = el('treeSvg');
        if (!svg) return;
        
        // Check for custom tree mode
        if (state.treeMode === 'custom' && state.customTree.nodes.length > 0) {
            drawCustomTree();
            return;
        }
        
        // Calculate expected values first
        calculateExpectedValues();
        
        const options = state.options;
        const nodeRadius = 12;
        const isIntermediateOrAdvanced = state.skillLevel === 'intermediate' || state.skillLevel === 'advanced';
        const showCosts = state.isCEA && (isIntermediateOrAdvanced || state.skillLevel === 'beginner');
        const hasTest = state.hasTest;
        const showNumbers = state.analysisUpdated;
        const hasIntermediate = state.showIntermediateOutcome && isIntermediateOrAdvanced;
        
        // Get "Who" label
        const whoInput = document.getElementById('who');
        const whoLabel = (whoInput ? whoInput.value : null) || state.who || 'Patient';
        
        // Limb labels are the disease states themselves: <Disease> / <No Disease>.
        const intermediateInput = document.querySelector('#intermediateOutcomeName');
        if (intermediateInput && intermediateInput.value.trim() &&
            state.intermediateOutcomes?.[0] &&
            intermediateInput.value.trim() !== state.intermediateOutcomes[0].name) {
            state.intermediateOutcomes[0].name = intermediateInput.value.trim();
            syncDiseaseStates(0);
        }
        const [diseasePresentLabel, diseaseAbsentLabel] = getDiseaseStateLabels(0);

        // Get alternative-specific utility values
        const vGoodValues = [], vBadValues = [];
        state.options.forEach((opt, i) => {
            vGoodValues[i] = paramOr(`v_good_${i}`, 0.9);
            vBadValues[i] = paramOr(`v_bad_${i}`, 0.3);
        });
        
        // Get treatment names
        const treatmentA = options[0] || 'Treatment A';
        const treatmentB = options[1] || 'Treatment B';
        
        // Find best option
        const bestOption = state.results.bestOption || state.options[0] || 'Option 1';
        const bestEV = typeof state.results.bestEV === 'number' ? state.results.bestEV : 0;
        
        // Layout
        const levelWidth = 160;
        const testNameInput = document.getElementById('testName');
        const testName = (testNameInput ? testNameInput.value : null) || state.testName || 'Test';
        const testPosLabel = `${testName}+`;
        const testNegLabel = `${testName}-`;
        const branchOptions = hasTest ? [...options, testName] : options;
        const totalBranches = hasTest ? options.length + 2 : options.length;
        const branchHeight = 100;
        const height = Math.max(500, 100 + totalBranches * branchHeight * 1.5);
        const width = hasTest ? 1100 : 900;
        
        // Probabilities
        const pDisease = paramOr('p_disease', 0.3);
        const testSens = paramOr('test_sens', 0.90);
        const testSpec = paramOr('test_spec', 0.85);
        const pTestPos = testSens * pDisease + (1 - testSpec) * (1 - pDisease);
        const pDiseaseGivenPos = (testSens * pDisease) / pTestPos;
        const pDiseaseGivenNeg = ((1 - testSens) * pDisease) / (1 - pTestPos);
        
        // Helper to truncate long labels (returns SVG-escaped text)
        function trunc(s, n) {
            const raw = String(s ?? '');
            return esc(raw.length <= n ? raw : raw.substring(0, n - 1) + '…');
        }
        
        let svgContent = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        
        // Title
        if (showNumbers) {
            svgContent += `<text x="${width / 2}" y="25" text-anchor="middle" font-size="14" 
                            fill="${CONFIG.colors.success}" font-weight="bold">
                            Optimal: ${esc(bestOption)} (E[V] = ${formatNumber(bestEV, 4)})</text>`;
        } else {
            svgContent += `<text x="${width / 2}" y="25" text-anchor="middle" font-size="13" 
                            fill="${CONFIG.colors.dark}" font-style="italic">
                            Click "Update Analysis" to replace labels with computed values</text>`;
        }
        
        // Decision node position
        const startX = 100;
        const decisionX = startX;
        const decisionY = height / 2;
        
        // Draw incoming line with "Who" label
        svgContent += `<line x1="10" y1="${decisionY}" x2="${decisionX - nodeRadius}" y2="${decisionY}" 
                            stroke="${CONFIG.colors.dark}" stroke-width="2"/>`;
        
        // Wrap long Who labels
        const maxCharsPerLine = 15;
        if (whoLabel.length > maxCharsPerLine) {
            const words = whoLabel.split(' ');
            let lines = [];
            let currentLine = '';
            words.forEach(word => {
                if ((currentLine + ' ' + word).trim().length <= maxCharsPerLine) {
                    currentLine = (currentLine + ' ' + word).trim();
                } else {
                    if (currentLine) lines.push(currentLine);
                    currentLine = word;
                }
            });
            if (currentLine) lines.push(currentLine);
            const lineHeight = 12;
            const startLineY = decisionY - 8 - (lines.length - 1) * lineHeight / 2;
            svgContent += `<text x="15" font-size="10" fill="${CONFIG.colors.purple}" font-weight="bold">`;
            lines.forEach((line, li) => {
                svgContent += `<tspan x="15" y="${startLineY + li * lineHeight}">${esc(line)}</tspan>`;
            });
            svgContent += `</text>`;
        } else {
            svgContent += `<text x="15" y="${decisionY - 8}" font-size="11" fill="${CONFIG.colors.purple}" font-weight="bold">${esc(whoLabel)}</text>`;
        }
        
        // Decision node (square)
        svgContent += `<rect x="${decisionX - nodeRadius}" y="${decisionY - nodeRadius}" 
                            width="${nodeRadius * 2}" height="${nodeRadius * 2}" 
                            fill="white" stroke="${CONFIG.colors.primary}" stroke-width="2"/>`;
        if (showNumbers) {
            svgContent += `<text x="${decisionX}" y="${decisionY - nodeRadius - 5}" text-anchor="middle" 
                            font-size="9" fill="${CONFIG.colors.success}" font-weight="bold">E=${formatNumber(bestEV, 3)}</text>`;
        }
        
        // Branch positions
        const topMargin = 60;
        const bottomMargin = 40;
        const usableHeight = height - topMargin - bottomMargin;
        const numMainBranches = branchOptions.length;
        const mainBranchSpacing = usableHeight / numMainBranches;
        
        // Draw branches for each option
        branchOptions.forEach((opt, optIdx) => {
            const isTest = opt === testName;
            const color = isTest ? CONFIG.colors.purple : CONFIG.colors.optionColors[optIdx % CONFIG.colors.optionColors.length];
            const isOptimal = showNumbers && opt === bestOption;
            const lineWidth = isOptimal ? 2.5 : 1.5;
            
            const mainY = topMargin + mainBranchSpacing * optIdx + mainBranchSpacing / 2;
            const branchX = decisionX + 40;
            const chanceX = branchX + levelWidth - 40;
            
            // Branch from decision node
            svgContent += `<line x1="${decisionX + nodeRadius}" y1="${decisionY}" x2="${branchX}" y2="${decisionY}" 
                                stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
            svgContent += `<line x1="${branchX}" y1="${decisionY}" x2="${branchX}" y2="${mainY}" 
                                stroke="${isOptimal ? CONFIG.colors.success : color}" stroke-width="${lineWidth}"/>`;
            svgContent += `<line x1="${branchX}" y1="${mainY}" x2="${chanceX - nodeRadius}" y2="${mainY}" 
                                stroke="${isOptimal ? CONFIG.colors.success : color}" stroke-width="${lineWidth}"/>`;
            svgContent += `<text x="${branchX + 15}" y="${mainY - 8}" font-size="11" fill="${color}" font-weight="bold">${esc(opt)}</text>`;

            let optEV = state.results[opt]?.ev || 0;
            
            if (isTest) {
                // === TEST BRANCH ===
                const vGood0 = vGoodValues[0] || 0.9;
                const vBad0 = vBadValues[0] || 0.3;
                const vGood1 = vGoodValues[1] || 0.9;
                const vBad1 = vBadValues[1] || 0.3;
                
                const evGivenTPos = pDiseaseGivenPos * vBad0 + (1 - pDiseaseGivenPos) * vGood0;
                const evGivenTNeg = pDiseaseGivenNeg * vBad1 + (1 - pDiseaseGivenNeg) * vGood1;
                optEV = pTestPos * evGivenTPos + (1 - pTestPos) * evGivenTNeg;
                
                // Test chance node
                svgContent += `<circle cx="${chanceX}" cy="${mainY}" r="${nodeRadius}" 
                                    fill="white" stroke="${CONFIG.colors.warning}" stroke-width="2"/>`;
                if (showNumbers) {
                    svgContent += `<text x="${chanceX}" y="${mainY - nodeRadius - 5}" text-anchor="middle" 
                                    font-size="9" fill="${CONFIG.colors.success}" font-weight="bold">E=${formatNumber(optEV, 3)}</text>`;
                }
                
                const testPosY = mainY - mainBranchSpacing * 0.3;
                const testNegY = mainY + mainBranchSpacing * 0.3;
                const testChanceX = chanceX + levelWidth - 20;
                const termX = testChanceX + levelWidth - 40;
                
                // Test positive path
                svgContent += `<line x1="${chanceX + nodeRadius}" y1="${mainY}" x2="${chanceX + 25}" y2="${mainY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                svgContent += `<line x1="${chanceX + 25}" y1="${mainY}" x2="${chanceX + 25}" y2="${testPosY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                svgContent += `<line x1="${chanceX + 25}" y1="${testPosY}" x2="${testChanceX - nodeRadius}" y2="${testPosY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                svgContent += `<text x="${chanceX + 35}" y="${testPosY - 6}" font-size="9" fill="${CONFIG.colors.dark}">${esc(testPosLabel)}, ${esc(treatmentA)}</text>`;
                if (showNumbers) {
                    svgContent += `<text x="${chanceX + 35}" y="${testPosY + 12}" font-size="8" fill="${CONFIG.colors.warning}">${pTestPos.toFixed(3)}</text>`;
                } else {
                    svgContent += `<text x="${chanceX + 35}" y="${testPosY + 12}" font-size="7" fill="${CONFIG.colors.warning}">sens*pDisease+(1-spec)*(1-pDisease)</text>`;
                }
                
                // Test positive -> Disease state
                svgContent += `<circle cx="${testChanceX}" cy="${testPosY}" r="${nodeRadius - 2}" fill="white" stroke="${CONFIG.colors.warning}" stroke-width="1.5"/>`;
                const disPosFromPos = testPosY - 25;
                const disNegFromPos = testPosY + 25;
                svgContent += `<line x1="${testChanceX + nodeRadius - 2}" y1="${testPosY}" x2="${testChanceX + 20}" y2="${testPosY}" stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
                svgContent += `<line x1="${testChanceX + 20}" y1="${testPosY}" x2="${testChanceX + 20}" y2="${disPosFromPos}" stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
                svgContent += `<line x1="${testChanceX + 20}" y1="${disPosFromPos}" x2="${termX}" y2="${disPosFromPos}" stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
                svgContent += `<text x="${testChanceX + 30}" y="${disPosFromPos - 4}" font-size="8">${esc(diseasePresentLabel)}</text>`;
                svgContent += showNumbers
                    ? `<text x="${testChanceX + 30}" y="${disPosFromPos + 10}" font-size="7" fill="${CONFIG.colors.purple}">${pDiseaseGivenPos.toFixed(3)}</text>`
                    : `<text x="${testChanceX + 30}" y="${disPosFromPos + 10}" font-size="6" fill="${CONFIG.colors.purple}">sens*pDisease/(sens*pDisease+(1-spec)*(1-pDisease))</text>`;
                svgContent += `<polygon points="${termX + 8},${disPosFromPos} ${termX},${disPosFromPos - 6} ${termX},${disPosFromPos + 6}" fill="${CONFIG.colors.danger}" stroke="${CONFIG.colors.danger}"/>`;
                svgContent += showNumbers
                    ? `<text x="${termX + 15}" y="${disPosFromPos + 4}" font-size="9" fill="${CONFIG.colors.success}">${vBad0.toFixed(2)}</text>`
                    : `<text x="${termX + 15}" y="${disPosFromPos + 4}" font-size="7" fill="${CONFIG.colors.purple}">U(${trunc(diseasePresentLabel,8)}|${trunc(treatmentA,8)})</text>`;
                
                // Disease absent from test positive
                svgContent += `<line x1="${testChanceX + 20}" y1="${testPosY}" x2="${testChanceX + 20}" y2="${disNegFromPos}" stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
                svgContent += `<line x1="${testChanceX + 20}" y1="${disNegFromPos}" x2="${termX}" y2="${disNegFromPos}" stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
                svgContent += `<text x="${testChanceX + 30}" y="${disNegFromPos - 4}" font-size="8">${esc(diseaseAbsentLabel)}</text>`;
                svgContent += showNumbers
                    ? `<text x="${testChanceX + 30}" y="${disNegFromPos + 10}" font-size="7" fill="${CONFIG.colors.teal}">${(1 - pDiseaseGivenPos).toFixed(3)}</text>`
                    : `<text x="${testChanceX + 30}" y="${disNegFromPos + 10}" font-size="7" fill="${CONFIG.colors.teal}">#</text>`;
                svgContent += `<polygon points="${termX + 8},${disNegFromPos} ${termX},${disNegFromPos - 6} ${termX},${disNegFromPos + 6}" fill="${CONFIG.colors.success}" stroke="${CONFIG.colors.success}"/>`;
                svgContent += showNumbers
                    ? `<text x="${termX + 15}" y="${disNegFromPos + 4}" font-size="9" fill="${CONFIG.colors.success}">${vGood0.toFixed(2)}</text>`
                    : `<text x="${termX + 15}" y="${disNegFromPos + 4}" font-size="7" fill="${CONFIG.colors.teal}">U(${trunc(diseaseAbsentLabel,8)}|${trunc(treatmentA,8)})</text>`;
                
                // Test negative path
                svgContent += `<line x1="${chanceX + 25}" y1="${mainY}" x2="${chanceX + 25}" y2="${testNegY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                svgContent += `<line x1="${chanceX + 25}" y1="${testNegY}" x2="${testChanceX - nodeRadius}" y2="${testNegY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                svgContent += `<text x="${chanceX + 35}" y="${testNegY - 6}" font-size="9" fill="${CONFIG.colors.dark}">${esc(testNegLabel)}, ${esc(treatmentB)}</text>`;
                svgContent += showNumbers
                    ? `<text x="${chanceX + 35}" y="${testNegY + 12}" font-size="8" fill="${CONFIG.colors.teal}">${(1 - pTestPos).toFixed(3)}</text>`
                    : `<text x="${chanceX + 35}" y="${testNegY + 12}" font-size="7" fill="${CONFIG.colors.teal}">#</text>`;
                
                // Test negative -> Disease state
                svgContent += `<circle cx="${testChanceX}" cy="${testNegY}" r="${nodeRadius - 2}" fill="white" stroke="${CONFIG.colors.warning}" stroke-width="1.5"/>`;
                const disPosFromNeg = testNegY - 25;
                const disNegFromNeg = testNegY + 25;
                svgContent += `<line x1="${testChanceX + nodeRadius - 2}" y1="${testNegY}" x2="${testChanceX + 20}" y2="${testNegY}" stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
                svgContent += `<line x1="${testChanceX + 20}" y1="${testNegY}" x2="${testChanceX + 20}" y2="${disPosFromNeg}" stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
                svgContent += `<line x1="${testChanceX + 20}" y1="${disPosFromNeg}" x2="${termX}" y2="${disPosFromNeg}" stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
                svgContent += `<text x="${testChanceX + 30}" y="${disPosFromNeg - 4}" font-size="8">${esc(diseasePresentLabel)}</text>`;
                svgContent += showNumbers
                    ? `<text x="${testChanceX + 30}" y="${disPosFromNeg + 10}" font-size="7" fill="${CONFIG.colors.purple}">${pDiseaseGivenNeg.toFixed(3)}</text>`
                    : `<text x="${testChanceX + 30}" y="${disPosFromNeg + 10}" font-size="6" fill="${CONFIG.colors.purple}">(1-sens)*pDisease/((1-sens)*pDisease+spec*(1-pDisease))</text>`;
                svgContent += `<polygon points="${termX + 8},${disPosFromNeg} ${termX},${disPosFromNeg - 6} ${termX},${disPosFromNeg + 6}" fill="${CONFIG.colors.danger}" stroke="${CONFIG.colors.danger}"/>`;
                svgContent += showNumbers
                    ? `<text x="${termX + 15}" y="${disPosFromNeg + 4}" font-size="9" fill="${CONFIG.colors.success}">${vBad1.toFixed(2)}</text>`
                    : `<text x="${termX + 15}" y="${disPosFromNeg + 4}" font-size="7" fill="${CONFIG.colors.purple}">U(${trunc(diseasePresentLabel,8)}|${trunc(treatmentB,8)})</text>`;
                
                // Disease absent from test negative
                svgContent += `<line x1="${testChanceX + 20}" y1="${testNegY}" x2="${testChanceX + 20}" y2="${disNegFromNeg}" stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
                svgContent += `<line x1="${testChanceX + 20}" y1="${disNegFromNeg}" x2="${termX}" y2="${disNegFromNeg}" stroke="${CONFIG.colors.dark}" stroke-width="1"/>`;
                svgContent += `<text x="${testChanceX + 30}" y="${disNegFromNeg - 4}" font-size="8">${esc(diseaseAbsentLabel)}</text>`;
                svgContent += showNumbers
                    ? `<text x="${testChanceX + 30}" y="${disNegFromNeg + 10}" font-size="7" fill="${CONFIG.colors.teal}">${(1 - pDiseaseGivenNeg).toFixed(3)}</text>`
                    : `<text x="${testChanceX + 30}" y="${disNegFromNeg + 10}" font-size="7" fill="${CONFIG.colors.teal}">#</text>`;
                svgContent += `<polygon points="${termX + 8},${disNegFromNeg} ${termX},${disNegFromNeg - 6} ${termX},${disNegFromNeg + 6}" fill="${CONFIG.colors.success}" stroke="${CONFIG.colors.success}"/>`;
                svgContent += showNumbers
                    ? `<text x="${termX + 15}" y="${disNegFromNeg + 4}" font-size="9" fill="${CONFIG.colors.success}">${vGood1.toFixed(2)}</text>`
                    : `<text x="${termX + 15}" y="${disNegFromNeg + 4}" font-size="7" fill="${CONFIG.colors.teal}">U(${trunc(diseaseAbsentLabel,8)}|${trunc(treatmentB,8)})</text>`;
                
            } else {
                // === TREATMENT BRANCH ===
                const treatmentIdx = state.options.indexOf(opt);
                const optVGood = vGoodValues[treatmentIdx] || 0.9;
                const optVBad = vBadValues[treatmentIdx] || 0.3;
                
                // Chance node
                svgContent += `<circle cx="${chanceX}" cy="${mainY}" r="${nodeRadius}" 
                                    fill="white" stroke="${CONFIG.colors.warning}" stroke-width="2"/>`;
                if (showNumbers) {
                    svgContent += `<text x="${chanceX}" y="${mainY - nodeRadius - 5}" text-anchor="middle" 
                                    font-size="9" fill="${CONFIG.colors.success}" font-weight="bold">E=${formatNumber(optEV, 3)}</text>`;
                }
                
                if (hasIntermediate) {
                    // Draw cascading intermediate outcomes
                    const numIntermediates = state.intermediateOutcomes.length;
                    const termXBase = chanceX + levelWidth * Math.min(numIntermediates, 3) + 20;
                    const totalSpread = mainBranchSpacing * 0.4;
                    
                    // Recursive function to draw intermediate branches. `path` accumulates
                    // one entry per level (1 = present, 0 = absent); at the leaf it selects
                    // that path's own utility parameter.
                    function drawIntermediateBranch(parentX, parentY, intIdx, yMin, yMax, path) {
                        if (intIdx >= numIntermediates) {
                            // Terminal node - draw terminal triangle (same size as decision square)
                            const termNodeSize = nodeRadius;
                            const allAbsent = path.every(present => present === 0);
                            const termColor = allAbsent ? CONFIG.colors.success : CONFIG.colors.danger;
                            svgContent += `<polygon points="${parentX + termNodeSize},${parentY} ${parentX},${parentY - termNodeSize} ${parentX},${parentY + termNodeSize}"
                                                fill="${termColor}"/>`;
                            // Terminal label and value for this complete path
                            const termStates = pathStateLabels(path);
                            const termValue = paramOr(
                                pathUtilityParamId(treatmentIdx, path),
                                pathUtilityDefault(path)
                            );
                            const termText = `U(${termStates.map(s => trunc(s, 9)).join(' & ')}|${trunc(opt, 9)})`;
                            svgContent += `<text x="${parentX + termNodeSize + 5}" y="${parentY - 3}" font-size="7" fill="${CONFIG.colors.dark}">${termText}</text>`;
                            if (showNumbers) {
                                svgContent += `<text x="${parentX + termNodeSize + 5}" y="${parentY + 10}" font-size="9" fill="${termColor}" font-weight="bold">${termValue.toFixed(2)}</text>`;
                            }
                            return;
                        }

                        const io = state.intermediateOutcomes[intIdx];
                        const ioName = getDiseaseNameForDisplay(intIdx);
                        const ioStates = getDiseaseStateLabels(intIdx);
                        const paramId = intIdx === 0 ? 'p_disease' : `p_disease_${intIdx}`;
                        const pPresent = paramOr(paramId, 0.3);
                        
                        const branchX = parentX + 25;
                        const nextChanceX = branchX + (levelWidth * 0.7);
                        const midY = (yMin + yMax) / 2;
                        const topY = yMin + (yMax - yMin) * 0.25;
                        const bottomY = yMin + (yMax - yMin) * 0.75;
                        
                        // Draw branch from parent
                        svgContent += `<line x1="${parentX + nodeRadius}" y1="${parentY}" x2="${branchX}" y2="${parentY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                        
                        // Top branch (Present)
                        svgContent += `<line x1="${branchX}" y1="${parentY}" x2="${branchX}" y2="${topY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                        svgContent += `<line x1="${branchX}" y1="${topY}" x2="${nextChanceX - (intIdx < numIntermediates - 1 ? nodeRadius - 2 : 0)}" y2="${topY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                        svgContent += `<text x="${branchX + 5}" y="${topY - 5}" font-size="8">${esc(ioStates[0])}</text>`;
                        // Probability under branch
                        svgContent += showNumbers
                            ? `<text x="${branchX + 5}" y="${topY + 10}" font-size="7" fill="${CONFIG.colors.purple}">${pPresent.toFixed(3)}</text>`
                            : `<text x="${branchX + 5}" y="${topY + 10}" font-size="6" fill="${CONFIG.colors.purple}">P(${trunc(ioStates[0], 16)})</text>`;
                        
                        // Bottom branch (Absent)
                        svgContent += `<line x1="${branchX}" y1="${parentY}" x2="${branchX}" y2="${bottomY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                        svgContent += `<line x1="${branchX}" y1="${bottomY}" x2="${nextChanceX - (intIdx < numIntermediates - 1 ? nodeRadius - 2 : 0)}" y2="${bottomY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                        svgContent += `<text x="${branchX + 5}" y="${bottomY - 5}" font-size="8">${esc(ioStates[1])}</text>`;
                        // Probability under branch
                        svgContent += showNumbers
                            ? `<text x="${branchX + 5}" y="${bottomY + 10}" font-size="7" fill="${CONFIG.colors.teal}">${(1 - pPresent).toFixed(3)}</text>`
                            : `<text x="${branchX + 5}" y="${bottomY + 10}" font-size="7" fill="${CONFIG.colors.teal}">#</text>`;
                        
                        // Recurse down both limbs. A chance-node circle is drawn only when
                        // another level follows; otherwise the child renders the leaf.
                        const childIsLeaf = intIdx + 1 >= numIntermediates;
                        if (!childIsLeaf) {
                            svgContent += `<circle cx="${nextChanceX}" cy="${topY}" r="${nodeRadius - 2}" fill="white" stroke="${CONFIG.colors.warning}" stroke-width="1.5"/>`;
                        }
                        drawIntermediateBranch(nextChanceX, topY, intIdx + 1, yMin, midY, [...path, 1]);

                        if (!childIsLeaf) {
                            svgContent += `<circle cx="${nextChanceX}" cy="${bottomY}" r="${nodeRadius - 2}" fill="white" stroke="${CONFIG.colors.warning}" stroke-width="1.5"/>`;
                        }
                        drawIntermediateBranch(nextChanceX, bottomY, intIdx + 1, midY, yMax, [...path, 0]);
                    }
                    
                    drawIntermediateBranch(chanceX, mainY, 0, mainY - totalSpread, mainY + totalSpread, []);
                    
                } else {
                    // Single disease chance node: <Disease> on top, <No Disease> below.
                    const termX = chanceX + levelWidth + 20;
                    const diseaseSpread = mainBranchSpacing * 0.25;
                    const pPresent = pDisease;

                    // Top branch - disease present
                    const topY = mainY - diseaseSpread;
                    svgContent += `<line x1="${chanceX + nodeRadius}" y1="${mainY}" x2="${chanceX + 25}" y2="${mainY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                    svgContent += `<line x1="${chanceX + 25}" y1="${mainY}" x2="${chanceX + 25}" y2="${topY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                    svgContent += `<line x1="${chanceX + 25}" y1="${topY}" x2="${termX}" y2="${topY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                    svgContent += `<text x="${chanceX + 35}" y="${topY - 4}" font-size="9">${esc(diseasePresentLabel)}</text>`;
                    svgContent += showNumbers
                        ? `<text x="${chanceX + 35}" y="${topY + 10}" font-size="8" fill="${CONFIG.colors.purple}">${pPresent.toFixed(3)}</text>`
                        : `<text x="${chanceX + 35}" y="${topY + 10}" font-size="7" fill="${CONFIG.colors.purple}">P(${trunc(diseasePresentLabel, 16)})</text>`;
                    // Terminal - same size as decision square
                    svgContent += `<polygon points="${termX + nodeRadius},${topY} ${termX},${topY - nodeRadius} ${termX},${topY + nodeRadius}"
                                        fill="${CONFIG.colors.danger}" stroke="${CONFIG.colors.danger}"/>`;
                    svgContent += showNumbers
                        ? `<text x="${termX + nodeRadius + 5}" y="${topY + 4}" font-size="9" fill="${CONFIG.colors.danger}" font-weight="bold">${optVBad.toFixed(2)}</text>`
                        : `<text x="${termX + nodeRadius + 5}" y="${topY + 4}" font-size="7" fill="${CONFIG.colors.danger}">U(${trunc(diseasePresentLabel,10)}|${trunc(opt,10)})</text>`;

                    if (showCosts && showNumbers) {
                        const costTxVal = paramOr(`cost_tx_${treatmentIdx}`, 1000);
                        svgContent += `<text x="${termX + 45}" y="${topY + 4}" font-size="8" fill="${CONFIG.colors.danger}">$${(((paramOr('cost_bad', 25000)) + costTxVal)/1000).toFixed(0)}k</text>`;
                    }

                    // Bottom branch - disease absent
                    const bottomY = mainY + diseaseSpread;
                    svgContent += `<line x1="${chanceX + 25}" y1="${mainY}" x2="${chanceX + 25}" y2="${bottomY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                    svgContent += `<line x1="${chanceX + 25}" y1="${bottomY}" x2="${termX}" y2="${bottomY}" stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
                    svgContent += `<text x="${chanceX + 35}" y="${bottomY - 4}" font-size="9">${esc(diseaseAbsentLabel)}</text>`;
                    svgContent += showNumbers
                        ? `<text x="${chanceX + 35}" y="${bottomY + 10}" font-size="8" fill="${CONFIG.colors.teal}">${(1 - pPresent).toFixed(3)}</text>`
                        : `<text x="${chanceX + 35}" y="${bottomY + 10}" font-size="7" fill="${CONFIG.colors.teal}">#</text>`;
                    // Terminal - same size as decision square
                    svgContent += `<polygon points="${termX + nodeRadius},${bottomY} ${termX},${bottomY - nodeRadius} ${termX},${bottomY + nodeRadius}"
                                        fill="${CONFIG.colors.success}" stroke="${CONFIG.colors.success}"/>`;
                    svgContent += showNumbers
                        ? `<text x="${termX + nodeRadius + 5}" y="${bottomY + 4}" font-size="9" fill="${CONFIG.colors.success}" font-weight="bold">${optVGood.toFixed(2)}</text>`
                        : `<text x="${termX + nodeRadius + 5}" y="${bottomY + 4}" font-size="7" fill="${CONFIG.colors.success}">U(${trunc(diseaseAbsentLabel,10)}|${trunc(opt,10)})</text>`;

                    if (showCosts && showNumbers) {
                        const costTxVal = paramOr(`cost_tx_${treatmentIdx}`, 1000);
                        svgContent += `<text x="${termX + 45}" y="${bottomY + 4}" font-size="8" fill="${CONFIG.colors.danger}">$${(((paramOr('cost_good', 5000)) + costTxVal)/1000).toFixed(0)}k</text>`;
                    }
                }
            }
        });
        
        svgContent += '</svg>';
        svg.innerHTML = svgContent;

        // Keep the legend's terminal entries in step with the limb labels
        const legendPresent = el('legendPresentTerminal');
        if (legendPresent) legendPresent.textContent = `${diseasePresentLabel} Terminal`;
        const legendAbsent = el('legendAbsentTerminal');
        if (legendAbsent) legendAbsent.textContent = `${diseaseAbsentLabel} Terminal`;
    }

    function drawRollbackTree() {
        const svg = el('rollbackSvg');
        if (!svg) return;
        
        // Check for custom tree mode
        if (state.treeMode === 'custom' && state.customTree.nodes.length > 0) {
            drawCustomRollbackTree();
            return;
        }
        
        // Calculate expected values first
        calculateExpectedValues();
        
        const options = state.options;
        const nodeRadius = 14;
        const startX = 80;
        const levelWidth = 180;
        const showCosts = state.isCEA && (state.skillLevel === 'intermediate' || state.skillLevel === 'beginner');
        
        // Calculate height dynamically - ensure no overlap
        const minOptionHeight = 140;
        const height = Math.max(450, 80 + options.length * minOptionHeight);
        const width = showCosts ? 850 : 700;
        
        // Find best option
        const bestOption = state.results.bestOption;
        const bestEV = state.results.bestEV;
        
        // Get alternative-specific utilities
        const vGoodValues = [];
        const vBadValues = [];
        state.options.forEach((opt, i) => {
            vGoodValues[i] = paramOr(`v_good_${i}`, 0.9);
            vBadValues[i] = paramOr(`v_bad_${i}`, 0.3);
        });
        
        // Get outcome costs
        const costGood = paramOr('cost_good', 5000);
        const costBad = paramOr('cost_bad', 25000);
        
        // Get custom outcome labels
        const [diseasePresentLabel, diseaseAbsentLabel] = getDiseaseStateLabels(0);
        
        let svgContent = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        
        // Title with best option
        if (showCosts) {
            const bestResult = state.results[bestOption];
            svgContent += `<text x="${width / 2}" y="20" text-anchor="middle" font-size="12" fill="${CONFIG.colors.success}" font-weight="bold">
                Best: ${esc(bestOption || 'N/A')}</text>`;
            svgContent += `<text x="${width / 2}" y="38" text-anchor="middle" font-size="11">
                <tspan fill="#27ae60">E[Effect]=${formatNumber(bestEV || 0, 3)}</tspan>
                <tspan fill="#7f8c8d"> | </tspan>
                <tspan fill="#e74c3c">E[Cost]=$${(bestResult?.expectedCost || 0).toLocaleString()}</tspan>
            </text>`;
        } else {
            svgContent += `<text x="${width / 2}" y="25" text-anchor="middle" font-size="14" fill="${CONFIG.colors.success}" font-weight="bold">
                Best Option: ${esc(bestOption || 'N/A')} (EV = ${formatNumber(bestEV || 0, 4)})</text>`;
        }
        
        // Column headers if showing costs
        if (showCosts) {
            const headerY = 55;
            const termX = startX + levelWidth + levelWidth - 50;
            const payoffX = termX + 55;
            svgContent += `<text x="${payoffX}" y="${headerY}" font-size="10" fill="#27ae60" font-weight="bold">Effect</text>`;
            svgContent += `<text x="${payoffX + 50}" y="${headerY}" font-size="10" fill="#e74c3c" font-weight="bold">Cost</text>`;
        }
        
        // Decision node (square)
        const decisionX = startX;
        const decisionY = height / 2;
        
        svgContent += `<rect x="${decisionX - nodeRadius}" y="${decisionY - nodeRadius}" 
                            width="${nodeRadius * 2}" height="${nodeRadius * 2}" 
                            fill="${CONFIG.colors.primary}" stroke="#2c3e50" stroke-width="2"/>`;
        
        if (showCosts) {
            const bestResult = state.results[bestOption];
            svgContent += `<text x="${decisionX}" y="${decisionY - nodeRadius - 12}" text-anchor="middle" 
                                font-size="9" font-weight="bold" fill="#27ae60">E=${formatNumber(bestEV || 0, 2)}</text>`;
            svgContent += `<text x="${decisionX}" y="${decisionY - nodeRadius - 2}" text-anchor="middle" 
                                font-size="9" font-weight="bold" fill="#e74c3c">$${((bestResult?.expectedCost || 0)/1000).toFixed(0)}k</text>`;
        } else {
            svgContent += `<text x="${decisionX}" y="${decisionY - nodeRadius - 8}" text-anchor="middle" 
                                font-size="10" font-weight="bold" fill="${CONFIG.colors.success}">
                                EV=${formatNumber(bestEV || 0)}</text>`;
        }
        
        // Calculate vertical positions - spread options evenly with guaranteed spacing
        const topMargin = 65;
        const bottomMargin = 40;
        const usableHeight = height - topMargin - bottomMargin;
        const optionBlockHeight = usableHeight / options.length;
        const termSpread = Math.min(45, (optionBlockHeight - 30) / 2);
        
        options.forEach((opt, optIdx) => {
            const color = CONFIG.colors.optionColors[optIdx % CONFIG.colors.optionColors.length];
            const isBest = opt === bestOption;
            const result = state.results[opt] || { ev: 0, pGood: 0.5, expectedCost: 0 };
            const pGood = result.pGood ?? (1 - (paramOr('p_disease', 0.3)));
            
            // Get treatment cost for this option
            const costTx = paramOr(`cost_tx_${optIdx}`, (1000 + optIdx * 500));
            
            // Y position for this option's branch - center of its block
            const optionY = topMargin + optionBlockHeight * optIdx + optionBlockHeight / 2;
            const chanceX = startX + levelWidth;
            
            // Line style based on whether this is the best option
            const lineStyle = isBest 
                ? `stroke="${CONFIG.colors.success}" stroke-width="3"` 
                : `stroke="${CONFIG.colors.dark}" stroke-width="2" stroke-dasharray="5,3"`;
            
            // Line from decision to option branch point
            const branchX = decisionX + 50;
            svgContent += `<line x1="${decisionX + nodeRadius}" y1="${decisionY}" 
                                x2="${branchX}" y2="${decisionY}" ${lineStyle}/>`;
            svgContent += `<line x1="${branchX}" y1="${decisionY}" 
                                x2="${branchX}" y2="${optionY}" ${lineStyle}/>`;
            svgContent += `<line x1="${branchX}" y1="${optionY}" 
                                x2="${chanceX - nodeRadius}" y2="${optionY}" ${lineStyle}/>`;
            
            // Option label with EV
            svgContent += `<text x="${branchX + 10}" y="${optionY - 8}" 
                                font-size="11" fill="${color}" font-weight="bold">${esc(opt)}</text>`;
            
            // Chance node (circle) with E[Effect] and E[Cost]
            svgContent += `<circle cx="${chanceX}" cy="${optionY}" r="${nodeRadius}" 
                                fill="${CONFIG.colors.danger}" stroke="#c0392b" stroke-width="2"/>`;
            
            if (showCosts) {
                svgContent += `<text x="${chanceX}" y="${optionY - nodeRadius - 12}" text-anchor="middle" 
                                    font-size="9" fill="#27ae60" font-weight="bold">E=${formatNumber(result.ev, 2)}</text>`;
                svgContent += `<text x="${chanceX}" y="${optionY - nodeRadius - 2}" text-anchor="middle" 
                                    font-size="9" fill="#e74c3c" font-weight="bold">$${(result.expectedCost/1000).toFixed(0)}k</text>`;
            } else {
                svgContent += `<text x="${chanceX}" y="${optionY - nodeRadius - 5}" text-anchor="middle" 
                                    font-size="10" fill="${CONFIG.colors.danger}" font-weight="bold">
                                    EV=${formatNumber(result.ev)}</text>`;
            }
            
            // Terminal nodes
            const termX = chanceX + levelWidth - 50;
            const payoffX = termX + 55;
            
            // Good outcome branch
            const goodY = optionY - termSpread;
            svgContent += `<line x1="${chanceX + nodeRadius}" y1="${optionY}" 
                                x2="${chanceX + 30}" y2="${optionY}" 
                                stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
            svgContent += `<line x1="${chanceX + 30}" y1="${optionY}" 
                                x2="${chanceX + 30}" y2="${goodY}" 
                                stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
            svgContent += `<line x1="${chanceX + 30}" y1="${goodY}" 
                                x2="${termX}" y2="${goodY}" 
                                stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
            
            // Good terminal with utility
            svgContent += `<polygon points="${termX + 10},${goodY} ${termX},${goodY - 10} ${termX},${goodY + 10}" 
                                fill="${CONFIG.colors.success}"/>`;
            svgContent += `<text x="${termX + 18}" y="${goodY + 4}" font-size="10">${esc(diseaseAbsentLabel)}</text>`;
            svgContent += `<text x="${chanceX + 50}" y="${goodY - 5}" font-size="9" fill="#27ae60">${pGood.toFixed(2)}</text>`;
            
            // Effect payoff (green) - use alternative-specific value
            const optVGood = vGoodValues[i] || 0.9;
            svgContent += `<text x="${payoffX}" y="${goodY + 4}" font-size="10" fill="#27ae60" font-weight="bold">${optVGood.toFixed(2)}</text>`;
            
            // Cost payoff (red) - Tx cost + outcome cost
            if (showCosts) {
                const totalCostGood = costTx + costGood;
                svgContent += `<text x="${payoffX + 50}" y="${goodY + 4}" font-size="10" fill="#e74c3c" font-weight="bold">$${totalCostGood.toLocaleString()}</text>`;
            }
            
            // Bad outcome branch
            const badY = optionY + termSpread;
            svgContent += `<line x1="${chanceX + 30}" y1="${optionY}" 
                                x2="${chanceX + 30}" y2="${badY}" 
                                stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
            svgContent += `<line x1="${chanceX + 30}" y1="${badY}" 
                                x2="${termX}" y2="${badY}" 
                                stroke="${CONFIG.colors.dark}" stroke-width="1.5"/>`;
            
            // Bad terminal with utility
            svgContent += `<polygon points="${termX + 10},${badY} ${termX},${badY - 10} ${termX},${badY + 10}" 
                                fill="${CONFIG.colors.warning}"/>`;
            svgContent += `<text x="${termX + 18}" y="${badY + 4}" font-size="10">${esc(diseasePresentLabel)}</text>`;
            svgContent += `<text x="${chanceX + 50}" y="${badY + 12}" font-size="9" fill="#e74c3c">${(1 - pGood).toFixed(2)}</text>`;
            
            // Effect payoff (green) - use alternative-specific value
            const optVBad = vBadValues[i] || 0.3;
            svgContent += `<text x="${payoffX}" y="${badY + 4}" font-size="10" fill="#27ae60" font-weight="bold">${optVBad.toFixed(2)}</text>`;
            
            // Cost payoff (red) - Tx cost + outcome cost
            if (showCosts) {
                const totalCostBad = costTx + costBad;
                svgContent += `<text x="${payoffX + 50}" y="${badY + 4}" font-size="10" fill="#e74c3c" font-weight="bold">$${totalCostBad.toLocaleString()}</text>`;
            }
        });
        
        svgContent += '</svg>';
        svg.innerHTML = svgContent;
    }

    // ============================================
    // CALCULATIONS
    // ============================================
    
    function calculateExpectedValues() {
        state.results = {};
        
        // Evaluate all formulas first
        evaluateAllParameters();
        
        // Cost parameters for CEA
        const costGood = paramOr('cost_good', 5000);
        const costBad = paramOr('cost_bad', 25000);
        
        // Disease prevalence (level 0 of the cascade)
        const pDisease = paramOr('p_disease', 0.3);

        // Every option hangs off the same disease cascade: the conditions are present or
        // absent before you act, so the level probabilities are shared and only the
        // utilities are option-specific. Each complete path carries its own utility.
        const paths = diseasePaths();
        const readProb = (paramId) => paramOr(paramId, 0.3);

        // Expected utility for one option. Pass firstState (1 present / 0 absent) to
        // condition on level 0 — the test arm needs that, since it substitutes its own
        // post-test P(disease) for the prior.
        const optionEV = (optIdx, firstState) => {
            let total = 0;
            paths.forEach(path => {
                if (firstState !== undefined && path[0] !== firstState) return;
                const utility = paramOr(
                    pathUtilityParamId(optIdx, path),
                    pathUtilityDefault(path)
                );
                const weight = pathProbability(path, readProb, firstState !== undefined ? 0 : undefined);
                total += weight * utility;
            });
            return total;
        };

        let bestEV = -Infinity;
        let bestOption = null;

        state.options.forEach((opt, i) => {
            const ev = optionEV(i);

            // Expected Cost = Treatment Cost + P(no disease)*Cost(no disease) + P(disease)*Cost(disease)
            // Costs remain keyed to level 0 only; they are not per-path.
            const pNoDisease = 1 - pDisease;
            const costTx = paramOr(`cost_tx_${i}`, (1000 + i * 500));
            const expectedCost = costTx + pNoDisease * costGood + pDisease * costBad;

            state.results[opt] = {
                ev,
                pGood: pNoDisease,
                // Expected utility given level 0 present / absent, marginalising deeper
                // levels. At one level these are just v_bad_i and v_good_i.
                vBad: optionEV(i, 1),
                vGood: optionEV(i, 0),
                expectedCost,
                costTx,
                costGood,
                costBad
            };

            if (ev > bestEV) {
                bestEV = ev;
                bestOption = opt;
            }
        });

        // Calculate Test option EV if test is enabled
        if (state.hasTest) {
            const testSens = paramOr('test_sens', 0.90);
            const testSpec = paramOr('test_spec', 0.85);
            
            // P(T+) = Sens * P(D+) + (1-Spec) * P(D-)
            const pTestPos = testSens * pDisease + (1 - testSpec) * (1 - pDisease);

            // P(D+ | T+) and P(D+ | T-)
            const pDiseaseGivenPos = (testSens * pDisease) / pTestPos;
            const pDiseaseGivenNeg = ((1 - testSens) * pDisease) / (1 - pTestPos);

            // The test only revises level 0, so swap the post-test probability in there
            // and let optionEV marginalise any deeper levels of the cascade.
            // EV(T+) - treat with option 0; EV(T-) - treat with option 1.
            const evGivenTPos = pDiseaseGivenPos * optionEV(0, 1) + (1 - pDiseaseGivenPos) * optionEV(0, 0);
            const evGivenTNeg = pDiseaseGivenNeg * optionEV(1, 1) + (1 - pDiseaseGivenNeg) * optionEV(1, 0);

            // EV(Test) = P(T+) * EV(T+) + P(T-) * EV(T-)
            const testEV = pTestPos * evGivenTPos + (1 - pTestPos) * evGivenTNeg;
            
            const testName = state.testName || 'Test';
            
            // Cost of test strategy
            const costTest = paramOr('cost_test', 500);
